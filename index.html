<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Laufchallenge</title>
  <style>
    :root{
      --bg:#0b0f14;
      --card:#121925;
      --card2:#0f1520;
      --border:#233044;
      --text:#e8eef7;
      --muted:#9aa7b6;
      --good:#22c55e;
      --bad:#ff6b6b;
    }
    *{ box-sizing:border-box; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; }
    body{
      margin:0;
      background: radial-gradient(1200px 600px at 20% 0%, #142033 0%, var(--bg) 55%), var(--bg);
      color:var(--text);
      padding:18px;
    }
    .wrap{ max-width:980px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
    .top{ display:flex; gap:12px; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; }
    h1{ margin:0; font-size:22px; letter-spacing:.2px; }
    .sub{ color:var(--muted); font-size:12px; margin-top:6px; }
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.03), transparent), var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:14px;
    }
    .side{ background: linear-gradient(180deg, rgba(255,255,255,.02), transparent), var(--card2); }
    .tabs{
      display:inline-flex; border:1px solid var(--border); border-radius:999px; overflow:hidden;
      background:rgba(255,255,255,.02);
    }
    .tab{
      padding:9px 12px; font-size:13px; border:0; color:var(--text); background:transparent; cursor:pointer;
    }
    .tab.active{ background:rgba(34,197,94,.15); color:#dff7e8; }
    .metaRow{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-top:8px; }
    .pill{ border:1px solid var(--border); background:rgba(255,255,255,.02); padding:5px 10px; border-radius:999px; font-size:12px; color:var(--muted); display:inline-flex; gap:6px; align-items:center; }
    .pill b{ color:var(--text); }
    .grid2{ display:grid; grid-template-columns:1fr; gap:12px; }
    @media (min-width:860px){ .grid2{ grid-template-columns:1.3fr .7fr; } }

    table{ width:100%; border-collapse:collapse; margin-top:10px; background:rgba(0,0,0,.06);
      border:1px solid var(--border); border-radius:14px; overflow:hidden; }
    th,td{ padding:10px; border-bottom:1px solid rgba(255,255,255,.06); text-align:left; vertical-align:top; }
    th{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); background:rgba(255,255,255,.02); }
    tr:last-child td{ border-bottom:0; }
    .km{ font-variant-numeric:tabular-nums; }
    .trend{ font-variant-numeric:tabular-nums; white-space:nowrap; }
    .up{ color:var(--good); } .down{ color:var(--bad); } .same{ color:var(--muted); }
    .tag{
      font-size:11px; color:var(--muted);
      border:1px solid rgba(255,255,255,.08);
      padding:2px 8px; border-radius:999px; background:rgba(255,255,255,.02); display:inline-block;
    }
    .hint{ color:var(--muted); font-size:12px; line-height:1.4; margin-top:10px; }
    .list{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }
    .li{ display:flex; justify-content:space-between; gap:10px; }
    .li > div{ width:100%; padding:8px 10px; border:1px solid rgba(255,255,255,.06); border-radius:12px; background:rgba(255,255,255,.02); }
    .li small{ color:var(--muted); }

    .rowclick{ cursor:pointer; }
    .caret{ width:26px; font-weight:900; }
    img.proof{ max-height:80px; border-radius:10px; border:1px solid rgba(255,255,255,.08); display:block; }
    code{ padding:1px 6px; border:1px solid rgba(255,255,255,.1); border-radius:8px; background:rgba(255,255,255,.03); }

    select,input,button{ font:inherit; }
    .adminGrid{ display:grid; gap:8px; grid-template-columns:1fr 160px 1fr; align-items:end; }
    @media (max-width:720px){ .adminGrid{ grid-template-columns:1fr; } }
    .inp, .sel{
      width:100%; padding:8px; border-radius:10px; border:1px solid var(--border);
      background:rgba(255,255,255,.02); color:var(--text);
    }
    .btn{
      padding:10px 14px; border-radius:12px; border:1px solid var(--border);
      background:rgba(255,255,255,.02); color:var(--text); cursor:pointer; font-weight:700;
    }
    .btnGood{ background:rgba(34,197,94,.15); color:#dff7e8; font-weight:800; }
    .btnBad{ background:rgba(255,107,107,.12); color:#ffd6d6; font-weight:800; }

    /* PODIUM / BADGES */
    .podiumWrap{ display:grid; grid-template-columns:1fr; gap:10px; margin-top:12px; margin-bottom:6px; }
    @media (min-width:700px){ .podiumWrap{ grid-template-columns:1fr 1fr 1fr; } }
    .podiumCard{
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px;
      background:rgba(255,255,255,.02);
      padding:12px;
      position:relative;
      overflow:hidden;
    }
    .podiumCard::before{
      content:"";
      position:absolute;
      inset:-60px -60px auto auto;
      width:120px;
      height:120px;
      border-radius:999px;
      background:rgba(255,255,255,.05);
      transform:rotate(20deg);
    }
    .podiumTop{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .podiumRank{ font-weight:900; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; }
    .podiumEmoji{ font-size:20px; }
    .podiumName{ font-weight:900; font-size:14px; margin-top:6px; }
    .podiumMeta{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
    .badgeMini{
      font-size:11px;
      padding:2px 8px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.02);
      color:var(--muted);
      display:inline-flex;
      gap:6px;
      align-items:center;
    }
    .badgeMini.good{ color:#dff7e8; border-color:rgba(34,197,94,.35); background:rgba(34,197,94,.12); }
    .badgeMini.warn{ color:#ffe9c7; border-color:rgba(255,186,73,.35); background:rgba(255,186,73,.10); }
    .badgeMini.fire{ color:#ffd1d1; border-color:rgba(255,107,107,.35); background:rgba(255,107,107,.10); }
    .badgeMini.blue{ color:#d7e9ff; border-color:rgba(122,183,255,.35); background:rgba(122,183,255,.10); }

    /* CONFETTI */
    .confetti{ position:fixed; inset:0; pointer-events:none; z-index:9999; overflow:hidden; display:none; }
    .confetti.show{ display:block; }
    .confetti span{
      position:absolute;
      top:-20px;
      font-size:18px;
      animation:fall 1.8s linear forwards;
      opacity:.95;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,.45));
    }
    @keyframes fall{ to{ transform:translateY(110vh) rotate(360deg); opacity:0.9; } }
  </style>
</head>
<body>
  <div class="confetti" id="confetti"></div>

  <div class="wrap">
    <div class="top">
      <div>
        <h1>⚽ Laufchallenge</h1>
        <div class="sub">Einzelrangliste & Gruppenübersicht · sortiert nach Strecke · Klick für Details</div>
      </div>

      <div class="tabs" role="tablist">
        <button class="tab active" id="tabPlayers" type="button">Einzel</button>
        <button class="tab" id="tabGroups" type="button">Gruppen</button>
      </div>
    </div>

    <div class="grid2">
      <div class="card" id="mainCard">
        <div class="metaRow">
          <div class="pill">Stand: <b id="stamp">—</b></div>
          <div class="pill" id="leaderStreakPill">🏁 Leader-Streak: <b>—</b></div>
          <div class="pill">Admin: <code>#admin</code> an die URL hängen</div>
        </div>

        <div id="adminBarMount"></div>

        <div id="playersView"></div>
        <div id="groupsView" style="display:none"></div>
      </div>

      <div class="card side">
        <div style="font-weight:800">Gruppen</div>
        <div class="hint">Liste der Gruppen & Mitglieder.</div>
        <div class="list" id="groupList"></div>
        <div class="hint" style="margin-top:12px">Daten aus <code>data.json</code>. Bilder aus <code>/uploads</code>.</div>
      </div>
    </div>
  </div>

  <script>
    // ====== STATE ======
    let DATA = null;
    let expandedGroup = null;
    let expandedPlayer = null;

    // Map: Name -> aktueller Rang (für Admin-Vorschläge)
    let CURRENT_RANK_BY_NAME = new Map();

    // ====== ADMIN PASS (nur Klickschutz, nicht echte Sicherheit) ======
    const ADMIN_PASSWORD = "14492";
    const ADMIN_SESSION_KEY = "laufchallenge_admin_ok";

    // ====== HELPERS ======
    const $ = (id) => document.getElementById(id);

    function esc(s){
      return String(s).replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[m]));
    }

    // ISO (YYYY-MM-DD) -> TT.MM.JJJJ (lokal)
    function formatDateDE(iso){
      if (!iso) return "—";
      const parts = String(iso).split("-");
      if (parts.length !== 3) return esc(iso);
      const y = Number(parts[0]), m = Number(parts[1]), d = Number(parts[2]);
      if (!y || !m || !d) return esc(iso);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString("de-DE");
    }

    function kmText(v){ return `${Number(v || 0).toFixed(2)} km`; }

    function playerSlug(playerName){
      return String(playerName)
        .toLowerCase()
        .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
        .replace(/[^a-z0-9]+/g,"_")
        .replace(/^_+|_+$/g,"");
    }

    function adminModeEnabled(){
      if (location.hash !== "#admin") return false;
      if (sessionStorage.getItem(ADMIN_SESSION_KEY) === "1") return true;

      const pw = prompt("Admin-Passwort:");
      if (pw === ADMIN_PASSWORD){
        sessionStorage.setItem(ADMIN_SESSION_KEY, "1");
        return true;
      }
      alert("Falsches Passwort.");
      return false;
    }

    function adminLogout(){
      sessionStorage.removeItem(ADMIN_SESSION_KEY);
      if (location.hash === "#admin") history.replaceState(null, "", location.pathname + location.search);
      render();
    }

    function groupColor(name){
      return (DATA && DATA.colors && DATA.colors[name]) ? DATA.colors[name] : "#94a3b8";
    }

    function trend(delta){
      if (delta > 0) return `<span class="trend up">▲ ${delta}</span>`;
      if (delta < 0) return `<span class="trend down">▼ ${Math.abs(delta)}</span>`;
      return `<span class="trend same">—</span>`;
    }

    function denseRank(sorted, keyFn){
      let rank = 0, last = null;
      return sorted.map(x => {
        const v = keyFn(x);
        if (last === null || v !== last) rank++;
        last = v;
        return { ...x, current_rank: rank };
      });
    }

    function buildNameToGroup(){
      const map = new Map();
      for (const g of DATA.groups) for (const m of g.members) map.set(m, g.name);
      return map;
    }

    function totalKmForPlayer(p){
      const runs = Array.isArray(p.runs) ? p.runs : [];
      let sum = 0;
      for (const r of runs) sum += Number(r.km || 0);
      return Number(sum.toFixed(2));
    }

    // ===== STREAK (Spieler): 3 Tage am Stück gelaufen? =====
    function has3DayStreak(runs){
      if (!Array.isArray(runs) || runs.length === 0) return false;
      const set = new Set();
      for (const r of runs){ if (r && r.date) set.add(String(r.date)); }

      const dates = Array.from(set)
        .map(d => {
          const p = d.split("-");
          if (p.length !== 3) return null;
          return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])).getTime();
        })
        .filter(x => Number.isFinite(x))
        .sort((a,b) => a - b);

      if (dates.length < 3) return false;

      const day = 24 * 60 * 60 * 1000;
      let streak = 1;

      for (let i=1;i<dates.length;i++){
        if (dates[i] - dates[i-1] === day){
          streak++;
          if (streak >= 3) return true;
        } else if (dates[i] !== dates[i-1]) {
          streak = 1;
        }
      }
      return false;
    }

    // ===== VERTEIDIGER (Leader 3 Tage+ Platz 1) =====
    function parseISOToLocalMidnight(iso){
      const p = String(iso || "").split("-");
      if (p.length !== 3) return null;
      const y = Number(p[0]), m = Number(p[1]), d = Number(p[2]);
      if (!y || !m || !d) return null;
      return new Date(y, m - 1, d, 0, 0, 0, 0);
    }

    function getAllRunDatesSorted(){
      const set = new Set();
      for (const pl of (DATA.players || [])){
        for (const r of (pl.runs || [])){
          if (r && r.date) set.add(String(r.date));
        }
      }
      return Array.from(set)
        .map(iso => ({ iso, dt: parseISOToLocalMidnight(iso) }))
        .filter(x => x.dt)
        .sort((a,b) => a.dt - b.dt)
        .map(x => x.iso);
    }

    function totalsUpToDateISO(dateISO){
      const totals = new Map();
      for (const pl of (DATA.players || [])){
        let sum = 0;
        for (const r of (pl.runs || [])){
          if (!r || !r.date) continue;
          if (String(r.date) <= String(dateISO)) sum += Number(r.km || 0);
        }
        totals.set(pl.name, Number(sum.toFixed(2)));
      }
      return totals;
    }

    function leaderOnDateISO(dateISO){
      const totals = totalsUpToDateISO(dateISO);
      let bestName = null;
      let bestKm = -Infinity;

      for (const [name, km] of totals.entries()){
        if (km > bestKm || (km === bestKm && String(name).localeCompare(String(bestName || "")) < 0)){
          bestKm = km;
          bestName = name;
        }
      }
      return bestName;
    }

    function defenderStreakDays(currentLeaderName){
      const dates = getAllRunDatesSorted();
      if (dates.length === 0) return 0;

      let streak = 0;
      let prevDt = null;

      for (let i = dates.length - 1; i >= 0; i--){
        const iso = dates[i];
        const dt = parseISOToLocalMidnight(iso);
        if (!dt) continue;

        const leader = leaderOnDateISO(iso);
        if (leader !== currentLeaderName) break;

        if (prevDt){
          const dayMs = 24 * 60 * 60 * 1000;
          if ((prevDt - dt) !== dayMs) break;
        }

        streak++;
        prevDt = dt;
      }
      return streak;
    }

    function buildPlayerRows(){
      const nameToGroup = buildNameToGroup();

      const rows = (DATA.players || []).map(p => ({
        name: p.name,
        group: nameToGroup.get(p.name) || "—",
        km: totalKmForPlayer(p),
        previousRank: (p.previousRank ?? null),
        runs: Array.isArray(p.runs) ? p.runs : []
      })).sort((a,b) => (b.km - a.km) || a.name.localeCompare(b.name));

      const ranked = denseRank(rows, r => r.km);

      // current rank map für Admin
      CURRENT_RANK_BY_NAME = new Map(ranked.map(r => [r.name, r.current_rank]));

      return ranked.map(r => {
        const prev = (r.previousRank == null) ? r.current_rank : r.previousRank;
        const delta = prev - r.current_rank;
        return { ...r, rank_delta: delta, has_streak3: has3DayStreak(r.runs) };
      });
    }

    function buildGroupRows(playerRows){
      const totals = new Map((DATA.groups || []).map(g => [g.name, 0]));
      for (const p of playerRows){
        if (totals.has(p.group)) totals.set(p.group, totals.get(p.group) + p.km);
      }
      const rows = Array.from(totals.entries())
        .map(([group, km]) => ({ group, km: Number(km.toFixed(2)) }))
        .sort((a,b) => (b.km - a.km) || a.group.localeCompare(b.group));
      const ranked = denseRank(rows, r => r.km);
      return ranked.map(r => ({ ...r, rank_delta: 0 }));
    }

    function membersOfGroupSorted(groupName, playerRows){
      const g = (DATA.groups || []).find(x => x.name === groupName);
      const members = g ? g.members : [];
      const kmByName = new Map(playerRows.map(p => [p.name, p.km]));
      return members
        .map(name => ({ name, km: kmByName.get(name) ?? 0 }))
        .sort((a,b) => (b.km - a.km) || a.name.localeCompare(b.name));
    }

    function downloadJson(filename, obj){
      const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    // ===== CONFETTI =====
    function launchConfetti(){
      const el = $("confetti");
      el.innerHTML = "";
      el.classList.add("show");

      const emojis = ["🎉","✨","🏆","⚡️","🎊","🥳"];
      const count = 42;

      for (let i=0;i<count;i++){
        const s = document.createElement("span");
        s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        s.style.left = (Math.random()*100) + "vw";
        s.style.animationDelay = (Math.random()*0.35) + "s";
        s.style.animationDuration = (1.5 + Math.random()*1.2) + "s";
        el.appendChild(s);
      }

      setTimeout(() => {
        el.classList.remove("show");
        el.innerHTML = "";
      }, 2600);
    }

    function maybeConfettiForNewLeader(playerRows){
      const leader = playerRows.find(p => p.current_rank === 1);
      if (!leader) return;

      const prev = (DATA.players || []).find(x => x.name === leader.name)?.previousRank;
      if (prev == null || Number(prev) <= 1) return;

      const standKey = `confetti_shown_${DATA.stand || "stand"}`;
      if (sessionStorage.getItem(standKey) === "1") return;

      sessionStorage.setItem(standKey, "1");
      launchConfetti();
    }

    // ====== ADMIN BAR ======
    function renderAdminBar(){
      if (!adminModeEnabled()) return "";

      const options = (DATA.players || [])
        .map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`)
        .join("");

      return `
        <div class="card" style="margin-top:12px">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-end;flex-wrap:wrap">
            <div style="font-weight:900">Admin</div>
            <button id="adminLogoutBtn" class="btn btnBad" type="button">Admin verlassen</button>
          </div>

          <div class="adminGrid" style="margin-top:10px">
            <div>
              <div class="hint" style="margin:0 0 4px 0">Spieler</div>
              <select id="adminPlayer" class="sel">${options}</select>
            </div>

            <div>
              <div class="hint" style="margin:0 0 4px 0">Strecke (km)</div>
              <input id="adminKm" class="inp" type="number" step="0.01" value="0">
            </div>

            <div>
              <div class="hint" style="margin:0 0 4px 0">Datum</div>
              <input id="adminDate" class="inp" type="date">
            </div>
          </div>

          <div class="adminGrid" style="margin-top:10px; grid-template-columns:1fr 160px 1fr;">
            <div>
              <div class="hint" style="margin:0 0 4px 0">Bild-Dateiname (im Spieler-Ordner)</div>
              <input id="adminImgName" class="inp" placeholder="lauf1.jpg">
              <div class="hint" id="adminPathHint" style="margin-top:6px"></div>
            </div>

            <div>
              <div class="hint" style="margin:0 0 4px 0">Rank für Trend speichern</div>
              <input id="adminPrevRank" class="inp" type="number" min="1" step="1" placeholder="z.B. 2">
              <div class="hint" style="margin-top:6px">Schreibt <code>previousRank</code> beim Spieler (für ▲/▼).</div>
            </div>

            <button id="adminAdd" class="btn btnGood" type="button">Lauf hinzufügen</button>
          </div>

          <div id="adminHint" class="hint" style="margin-top:10px"></div>

          <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center">
            <button id="adminDownload" class="btn" type="button">data.json herunterladen</button>
            <div class="hint" style="margin:0">Dann <code>data.json</code> + Bild in GitHub hochladen → Link bleibt gleich.</div>
          </div>
        </div>
      `;
    }

    function wireAdmin(){
      if (!adminModeEnabled()) return;

      const today = new Date().toISOString().slice(0,10);
      $("adminDate").value = today;

      const updateHints = () => {
        const playerName = $("adminPlayer").value.trim();
        const slug = playerSlug(playerName);
        const p = (DATA.players || []).find(x => x.name === playerName);
        const nextRun = (p && Array.isArray(p.runs)) ? (p.runs.length + 1) : 1;

        // Vorschlag: laufX.jpg (nur Dateiname)
        if (!$("adminImgName").value) $("adminImgName").value = `lauf${nextRun}.jpg`;

        // Path-Hint
        $("adminPathHint").innerHTML = `Upload nach: <code>uploads/${esc(slug)}/</code>`;

        // Vorschlag für previousRank (aktueller Rang)
        const curRank = CURRENT_RANK_BY_NAME.get(playerName);
        if (!$("adminPrevRank").value && Number.isFinite(curRank)) $("adminPrevRank").value = curRank;
      };

      $("adminPlayer").addEventListener("change", () => {
        $("adminImgName").value = "";
        $("adminPrevRank").value = "";
        updateHints();
      });

      updateHints();

      $("adminLogoutBtn").addEventListener("click", adminLogout);

      $("adminAdd").addEventListener("click", () => {
        const playerName = $("adminPlayer").value.trim();
        const km = Number($("adminKm").value || 0);
        const date = $("adminDate").value;
        const imgName = $("adminImgName").value.trim();
        const prevRankInput = Number($("adminPrevRank").value || 0);

        if (!playerName || !date || !Number.isFinite(km) || km <= 0){
          $("adminHint").textContent = "Bitte Spieler, Datum und Strecke > 0 ausfüllen.";
          return;
        }
        if (!imgName){
          $("adminHint").textContent = "Bitte Bild-Dateiname eintragen (z.B. lauf1.jpg).";
          return;
        }

        const p = (DATA.players || []).find(x => x.name === playerName);
        if (!p){
          $("adminHint").textContent = "Spieler nicht gefunden.";
          return;
        }
        if (!Array.isArray(p.runs)) p.runs = [];

        const slug = playerSlug(playerName);
        const imgPath = `uploads/${slug}/${imgName}`;

        p.runs.push({ date, km: Number(km.toFixed(2)), img: imgPath });

        // previousRank setzen (damit Trend beim nächsten Stand korrekt ist)
        if (Number.isFinite(prevRankInput) && prevRankInput >= 1){
          p.previousRank = Math.floor(prevRankInput);
        }

        $("adminHint").innerHTML =
          `✅ Lauf hinzugefügt (lokal).<br>` +
          `1) Lade das Bild nach <code>uploads/${esc(slug)}/</code> hoch und nenn es <code>${esc(imgName)}</code>.<br>` +
          `2) Klick <b>data.json herunterladen</b> und ersetze die Datei im Repo.`;

        // reset nur km + bildname auto fürs nächste
        $("adminKm").value = 0;
        $("adminImgName").value = "";
        updateHints();

        render();
      });

      $("adminDownload").addEventListener("click", () => downloadJson("data.json", DATA));
    }

    // ====== RENDER ======
    function render(){
      $("stamp").textContent = (DATA && DATA.stand) ? DATA.stand : "—";

      $("adminBarMount").innerHTML = renderAdminBar();

      $("groupList").innerHTML = (DATA.groups || []).map(g => `
        <div class="li">
          <div>
            <b style="color:${groupColor(g.name)}">${esc(g.name)}</b><br>
            <small>${(g.members||[]).map(esc).join(", ")}</small>
          </div>
        </div>
      `).join("");

      const playerRows = buildPlayerRows();
      const groupRows = buildGroupRows(playerRows);

      // Live Leader-Streak Counter (oben)
      const currentLeader = playerRows.find(p => p.current_rank === 1) || null;
      const leaderDefDays = currentLeader ? defenderStreakDays(currentLeader.name) : 0;
      $("leaderStreakPill").innerHTML =
        `🏁 Leader-Streak: <b>${currentLeader ? esc(currentLeader.name) : "—"}</b> · <b>${leaderDefDays || 0} Tage</b>`;

      // Most Improved (größter delta > 0)
      const mostImproved = playerRows
        .filter(p => p.rank_delta > 0)
        .sort((a,b) => (b.rank_delta - a.rank_delta) || (b.km - a.km))[0] || null;

      // Podium Top 3
      const top3 = playerRows.slice(0,3);

      // Confetti ggf. für neuen Leader (nur wenn previousRank gepflegt ist)
      maybeConfettiForNewLeader(playerRows);

      // Players
      $("playersView").innerHTML = `
        ${top3.length ? `
          <div class="podiumWrap">
            ${top3.map((p, idx) => {
              const rank = idx + 1;
              const emoji = rank === 1 ? "👑" : (rank === 2 ? "🥈" : "🥉");
              const mi = (mostImproved && mostImproved.name === p.name) ? `<span class="badgeMini blue">🚀 Most Improved</span>` : "";
              const st = p.has_streak3 ? `<span class="badgeMini fire">🔥 3-Tage-Streak</span>` : "";
              const def = (rank === 1 && leaderDefDays >= 3) ? `<span class="badgeMini warn">🛡 Verteidiger · ${leaderDefDays} Tage</span>` : "";
              const gcol = groupColor(p.group);
              return `
                <div class="podiumCard" style="border-color:${gcol}33">
                  <div class="podiumTop">
                    <div class="podiumRank">Platz ${rank}</div>
                    <div class="podiumEmoji">${emoji}</div>
                  </div>
                  <div class="podiumName">${esc(p.name)}</div>
                  <div class="podiumMeta">
                    <span class="badgeMini" style="border-color:${gcol}55;color:${gcol}">${esc(p.group)}</span>
                    <span class="badgeMini good">${kmText(p.km)}</span>
                    ${mi}${st}${def}
                  </div>
                </div>
              `;
            }).join("")}
          </div>
          <div class="hint">Ab Platz 4 geht’s in der Tabelle weiter.</div>
        ` : ""}

        <table>
          <thead>
            <tr>
              <th></th>
              <th>Trend</th>
              <th>Rang</th>
              <th>Spieler</th>
              <th>Gruppe</th>
              <th class="km">Strecke</th>
            </tr>
          </thead>
          <tbody>
            ${playerRows.map(pr => {
              const open = expandedPlayer === pr.name;

              const medal = pr.current_rank === 1 ? "👑" : (pr.current_rank === 2 ? "🥈" : (pr.current_rank === 3 ? "🥉" : ""));
              const miBadge = (mostImproved && mostImproved.name === pr.name) ? `<span class="badgeMini blue" style="margin-left:8px">🚀 Most Improved</span>` : "";
              const streakBadge = pr.has_streak3 ? `<span class="badgeMini fire" style="margin-left:8px">🔥 3-Tage-Streak</span>` : "";
              const defBadge = (pr.current_rank === 1 && leaderDefDays >= 3) ? `<span class="badgeMini warn" style="margin-left:8px">🛡 Verteidiger · ${leaderDefDays} Tage</span>` : "";

              const runsSorted = [...(pr.runs||[])].sort((a,b) => String(b.date||"").localeCompare(String(a.date||"")));

              const details = `
                <tr class="player-details" data-player="${esc(pr.name)}" style="${open ? "" : "display:none"}">
                  <td colspan="6" style="padding:0">
                    <div style="padding:10px 10px 12px 10px; border-top:1px solid rgba(255,255,255,.06)">
                      <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-end;margin-bottom:8px">
                        <div style="font-weight:900">${esc(pr.name)} – Läufe</div>
                        <div style="font-size:12px;color:var(--muted)">Gesamt: ${kmText(pr.km)}</div>
                      </div>

                      ${runsSorted.length === 0 ? `
                        <div class="hint" style="margin:0">Noch keine Läufe eingetragen.</div>
                      ` : `
                        <table style="width:100%; border-collapse:collapse; background:rgba(0,0,0,.06); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-top:0">
                          <thead>
                            <tr>
                              <th>Run</th>
                              <th>Datum</th>
                              <th class="km">Strecke</th>
                              <th>Beweis</th>
                            </tr>
                          </thead>
                          <tbody>
                            ${runsSorted.map((r, i) => `
                              <tr style="border-top:1px solid rgba(255,255,255,.06)">
                                <td>${i + 1}</td>
                                <td>${formatDateDE(r.date || "")}</td>
                                <td class="km">${kmText(r.km)}</td>
                                <td>
                                  ${r.img ? `
                                    <a href="${esc(r.img)}" target="_blank" rel="noreferrer" style="color:var(--text);text-decoration:none">
                                      <img class="proof" src="${esc(r.img)}" alt="Beweis">
                                    </a>
                                  ` : `<span class="hint" style="margin:0">—</span>`}
                                </td>
                              </tr>
                            `).join("")}
                          </tbody>
                        </table>
                      `}
                    </div>
                  </td>
                </tr>
              `;

              return `
                <tr class="player-row rowclick" data-player="${esc(pr.name)}">
                  <td class="caret" style="color:${groupColor(pr.group)}">${open ? "▾" : "▸"}</td>
                  <td>${trend(pr.rank_delta)}</td>
                  <td>${pr.current_rank}</td>
                  <td>
                    <b>${esc(pr.name)}${medal ? `<span style="margin-left:6px">${medal}</span>` : ""}</b>
                    ${miBadge}${streakBadge}${defBadge}
                  </td>
                  <td>
                    <span class="tag" style="border-color:${groupColor(pr.group)}; color:${groupColor(pr.group)}">
                      ${esc(pr.group)}
                    </span>
                  </td>
                  <td class="km">${kmText(pr.km)}</td>
                </tr>
                ${details}
              `;
            }).join("")}
          </tbody>
        </table>
      `;

      // Groups
      $("groupsView").innerHTML = `
        <table>
          <thead>
            <tr>
              <th></th>
              <th>Trend</th>
              <th>Rang</th>
              <th>Gruppe</th>
              <th class="km">Strecke</th>
            </tr>
          </thead>
          <tbody>
            ${groupRows.map(gr => {
              const open = expandedGroup === gr.group;
              const members = membersOfGroupSorted(gr.group, playerRows);

              const details = `
                <tr class="group-details" data-group="${esc(gr.group)}" style="${open ? "" : "display:none"}">
                  <td colspan="5" style="padding:0">
                    <div style="padding:10px 10px 12px 10px; border-top:1px solid rgba(255,255,255,.06)">
                      <div style="display:flex; justify-content:space-between; align-items:flex-end; gap:10px; margin-bottom:8px">
                        <div style="font-weight:900; color:${groupColor(gr.group)}">${esc(gr.group)} – Mitglieder</div>
                        <div style="font-size:12px; color:var(--muted)">Sortiert nach Strecke</div>
                      </div>

                      <table style="width:100%; border-collapse:collapse; background:rgba(0,0,0,.06); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-top:0">
                        <thead>
                          <tr>
                            <th>#</th>
                            <th>Spieler</th>
                            <th class="km">Strecke</th>
                          </tr>
                        </thead>
                        <tbody>
                          ${members.map((m, idx) => `
                            <tr style="border-top:1px solid rgba(255,255,255,.06)">
                              <td>${idx+1}</td>
                              <td style="font-weight:800">${esc(m.name)}${idx===0 ? `<span style="margin-left:8px">👑</span>` : ""}</td>
                              <td class="km">${kmText(m.km)}</td>
                            </tr>
                          `).join("")}
                        </tbody>
                      </table>
                    </div>
                  </td>
                </tr>
              `;

              return `
                <tr class="group-row rowclick" data-group="${esc(gr.group)}">
                  <td class="caret" style="color:${groupColor(gr.group)}">${open ? "▾" : "▸"}</td>
                  <td>${trend(gr.rank_delta)}</td>
                  <td>${gr.current_rank}</td>
                  <td><b style="color:${groupColor(gr.group)}">${esc(gr.group)}</b></td>
                  <td class="km">${kmText(gr.km)}</td>
                </tr>
                ${details}
              `;
            }).join("")}
          </tbody>
        </table>
      `;

      wireAdmin();
    }

    // ====== VIEW SWITCH ======
    function setView(which){
      const pv = $("playersView");
      const gv = $("groupsView");
      const tp = $("tabPlayers");
      const tg = $("tabGroups");

      if (which === "groups"){
        pv.style.display = "none";
        gv.style.display = "block";
        tp.classList.remove("active");
        tg.classList.add("active");
      } else {
        gv.style.display = "none";
        pv.style.display = "block";
        tg.classList.remove("active");
        tp.classList.add("active");
      }
    }

    $("tabPlayers").addEventListener("click", () => setView("players"));
    $("tabGroups").addEventListener("click", () => setView("groups"));

    document.addEventListener("click", (e) => {
      const pr = e.target.closest && e.target.closest("tr.player-row");
      if (pr){
        const name = pr.getAttribute("data-player");
        expandedPlayer = (expandedPlayer === name) ? null : name;
        render();
        return;
      }
      const gr = e.target.closest && e.target.closest("tr.group-row");
      if (gr){
        const name = gr.getAttribute("data-group");
        expandedGroup = (expandedGroup === name) ? null : name;
        render();
      }
    });

    // ====== INIT ======
    async function init(){
      const res = await fetch("data.json", { cache: "no-store" });
      if (!res.ok) throw new Error("data.json nicht gefunden (Status " + res.status + ")");
      DATA = await res.json();
      if (!DATA.groups || !DATA.players) throw new Error("data.json fehlt groups/players");
      render();
    }

    document.addEventListener("DOMContentLoaded", () => {
      init().catch(err => {
        console.error(err);
        $("playersView").innerHTML =
          `<div class="hint">Fehler: ${esc(err.message)}<br>Prüfe, ob <code>data.json</code> im Repo-Root liegt und gültiges JSON ist.</div>`;
      });
    });
  </script>
</body>
</html>
