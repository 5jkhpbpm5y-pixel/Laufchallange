<script>
  // ====== lädt data.json und rendert alles ======
  let DATA = null;

  // Accordion Zustände
  let expandedGroup = null;
  let expandedPlayer = null;

  const $ = (id) => document.getElementById(id);

  function esc(s){
    return String(s).replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[m]));
  }

  function groupColor(name){
    return (DATA?.colors?.[name]) || "#94a3b8";
  }

  function trend(delta){
    if (delta > 0) return `<span class="trend up">▲ ${delta}</span>`;
    if (delta < 0) return `<span class="trend down">▼ ${Math.abs(delta)}</span>`;
    return `<span class="trend same">—</span>`;
  }

  function denseRank(sorted, keyFn){
    let rank = 0, last = null;
    return sorted.map(x => {
      const v = keyFn(x);
      if (last === null || v !== last) rank++;
      last = v;
      return { ...x, current_rank: rank };
    });
  }

  function buildMaps(){
    const nameToGroup = new Map();
    for (const g of DATA.groups) for (const m of g.members) nameToGroup.set(m, g.name);
    return { nameToGroup };
  }

  function totalKmForPlayer(p){
    const runs = Array.isArray(p.runs) ? p.runs : [];
    let sum = 0;
    for (const r of runs) sum += Number(r.km || 0);
    return Number(sum.toFixed(2));
  }

  function buildPlayerRows(){
    const { nameToGroup } = buildMaps();

    const rows = DATA.players.map(p => {
      const km = totalKmForPlayer(p);
      return {
        name: p.name,
        group: nameToGroup.get(p.name) || "—",
        km,
        previousRank: p.previousRank ?? null,
        runs: Array.isArray(p.runs) ? p.runs : []
      };
    }).sort((a,b) => (b.km - a.km) || a.name.localeCompare(b.name));

    const ranked = denseRank(rows, r => r.km);

    return ranked.map(r => {
      const prev = (r.previousRank == null) ? r.current_rank : r.previousRank;
      const delta = prev - r.current_rank;
      return { ...r, rank_delta: delta };
    });
  }

  function buildGroupRows(playerRows){
    const totals = new Map(DATA.groups.map(g => [g.name, 0]));
    for (const p of playerRows){
      if (totals.has(p.group)) totals.set(p.group, totals.get(p.group) + p.km);
    }

    const rows = Array.from(totals.entries())
      .map(([group, km]) => ({ group, km: Number(km.toFixed(2)) }))
      .sort((a,b) => (b.km - a.km) || a.group.localeCompare(b.group));

    const ranked = denseRank(rows, r => r.km);

    return ranked.map(r => ({ ...r, rank_delta: 0 }));
  }

  function membersOfGroupSorted(groupName, playerRows){
    const g = DATA.groups.find(x => x.name === groupName);
    const members = g ? g.members : [];
    const kmByName = new Map(playerRows.map(p => [p.name, p.km]));

    return members
      .map(name => ({ name, km: kmByName.get(name) ?? 0 }))
      .sort((a,b) => (b.km - a.km) || a.name.localeCompare(b.name));
  }

  function adminModeEnabled(){
    return location.hash === "#admin";
  }

  function runImagePath(fileName){
    // erwartet, dass du das Bild im Repo unter /uploads/ hochlädst
    return `uploads/${fileName}`;
  }

  function suggestedFileName(playerName, dateStr){
    const safe = playerName
      .toLowerCase()
      .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
      .replace(/[^a-z0-9]+/g,"_")
      .replace(/^_+|_+$/g,"");
    return `${safe}_${dateStr}.jpg`;
  }

  function downloadJson(filename, obj){
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function renderAdminBar(){
    if (!adminModeEnabled()) return "";

    const options = DATA.players
      .map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`)
      .join("");

    return `
      <div class="card" style="margin-bottom:12px">
        <div style="font-weight:800;margin-bottom:8px">Admin</div>

        <div style="display:grid; gap:8px; grid-template-columns:1fr 140px 1fr; align-items:end">
          <div>
            <div style="font-size:12px;color:var(--muted);margin-bottom:4px">Spieler</div>
            <select id="adminPlayer" style="width:100%;padding:8px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.02);color:var(--text)">
              ${options}
            </select>
          </div>

          <div>
            <div style="font-size:12px;color:var(--muted);margin-bottom:4px">km</div>
            <input id="adminKm" type="number" step="0.01" value="0"
              style="width:100%;padding:8px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.02);color:var(--text)">
          </div>

          <div>
            <div style="font-size:12px;color:var(--muted);margin-bottom:4px">Datum (YYYY-MM-DD)</div>
            <input id="adminDate" type="date"
              style="width:100%;padding:8px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.02);color:var(--text)">
          </div>
        </div>

        <div style="display:grid; gap:8px; grid-template-columns:1fr auto; align-items:end; margin-top:10px">
          <div>
            <div style="font-size:12px;color:var(--muted);margin-bottom:4px">Beweisbild Dateiname (du lädst es nachher in /uploads/ hoch)</div>
            <input id="adminImgName" placeholder="z.B. valentin_2026-01-06.jpg"
              style="width:100%;padding:8px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.02);color:var(--text)">
          </div>

          <button id="adminAdd"
            style="padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:rgba(34,197,94,.15);color:#dff7e8;cursor:pointer;font-weight:800">
            Lauf hinzufügen
          </button>
        </div>

        <div id="adminHint" class="hint" style="margin-top:10px"></div>

        <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap">
          <button id="adminDownload"
  style="padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.02);color:var(--text)">
  data.json herunterladen
</button>
<div class="hint" style="margin:0">
  Danach <code>data.json</code> + Bild in GitHub hochladen → Link bleibt gleich.
</div>
    `;
  }

  function wireAdmin(){
    if (!adminModeEnabled()) return;

    const today = new Date();
    const iso = today.toISOString().slice(0,10);
    $("adminDate").value = iso;

    const updateSuggested = () => {
      const player = $("adminPlayer").value;
      const date = $("adminDate").value || iso;
      const sug = suggestedFileName(player, date);
      if (!$("adminImgName").value) $("adminImgName").value = sug;
    };

    $("adminPlayer").addEventListener("change", updateSuggested);
    $("adminDate").addEventListener("change", updateSuggested);
    updateSuggested();

    $("adminAdd").addEventListener("click", () => {
      const playerName = $("adminPlayer").value.trim();
      const km = Number($("adminKm").value || 0);
      const date = $("adminDate").value;
      const imgName = $("adminImgName").value.trim();

      if (!playerName || !date || !Number.isFinite(km) || km <= 0){
        $("adminHint").innerHTML = `Bitte Spieler, Datum und km > 0 ausfüllen.`;
        return;
      }
      if (!imgName){
        $("adminHint").innerHTML = `Bitte Bild-Dateiname eintragen (z.B. ${esc(suggestedFileName(playerName, date))}).`;
        return;
      }

      const p = DATA.players.find(x => x.name === playerName);
      if (!p){
        $("adminHint").innerHTML = `Spieler nicht gefunden.`;
        return;
      }

      if (!Array.isArray(p.runs)) p.runs = [];
      p.runs.push({ date, km: Number(km.toFixed(2)), img: runImagePath(imgName) });

      $("adminHint").innerHTML = `
        ✅ Lauf gespeichert (lokal im Browser).<br>
        1) Lade dein Bild als <b>${esc(imgName)}</b> in den Repo-Ordner <b>/uploads/</b> hoch.<br>
        2) Klick auf <b>data.json herunterladen</b> und lade die Datei ins Repo hoch (ersetzen).<br>
        Dann sehen es alle.
      `;

      render();
    });

    $("adminDownload").addEventListener("click", () => {
      downloadJson("data.json", DATA);
    });
  }

  function render(){
    // Stand setzen
    $("stamp").textContent = DATA.stand || "—";

    // Admin-Leiste oben in die Seite injizieren (vor mainCard)
    const wrap = document.querySelector(".wrap");
    const existing = document.getElementById("adminBar");
    if (existing) existing.remove();

    const adminHtml = renderAdminBar();
    if (adminHtml){
      const div = document.createElement("div");
      div.id = "adminBar";
      div.innerHTML = adminHtml;
      // direkt nach Top-Bar einfügen
      wrap.insertBefore(div, wrap.children[1]);
    }

    // Sidebar Gruppenliste
    $("groupList").innerHTML = DATA.groups.map(g => `
      <div class="li">
        <div>
          <b style="color:${groupColor(g.name)}">${esc(g.name)}</b><br>
          <small>${g.members.map(esc).join(", ")}</small>
        </div>
      </div>
    `).join("");

    const playerRows = buildPlayerRows();
    const groupRows = buildGroupRows(playerRows);

    // Einzel (klickbar -> Läufe)
    $("playersView").innerHTML = `
      <table>
        <thead>
          <tr>
            <th></th>
            <th>Trend</th>
            <th>Rang</th>
            <th>Spieler</th>
            <th>Gruppe</th>
            <th class="km">km</th>
          </tr>
        </thead>
        <tbody>
          ${playerRows.map(pr => {
            const open = expandedPlayer === pr.name;
            const crown = pr.current_rank === 1 ? `<span title="Platz 1" style="margin-left:6px">👑</span>` : "";
            const runsSorted = [...pr.runs].sort((a,b) => String(b.date).localeCompare(String(a.date)));

            const details = `
              <tr class="player-details" data-player="${esc(pr.name)}" style="${open ? "" : "display:none"}">
                <td colspan="6" style="padding:0">
                  <div style="padding:10px 10px 12px 10px; border-top:1px solid rgba(255,255,255,.06)">
                    <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-end;margin-bottom:8px">
                      <div style="font-weight:800">${esc(pr.name)} – Läufe</div>
                      <div style="font-size:12px;color:var(--muted)">Gesamt: ${pr.km.toFixed(2)} km</div>
                    </div>

                    ${runsSorted.length === 0 ? `
                      <div class="hint" style="margin:0">Noch keine Läufe eingetragen.</div>
                    ` : `
                      <table style="width:100%; border-collapse:collapse; background:rgba(0,0,0,.06); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-top:0">
                        <thead>
                          <tr>
                            <th style="padding:8px 10px">Datum</th>
                            <th style="padding:8px 10px" class="km">km</th>
                            <th style="padding:8px 10px">Beweis</th>
                          </tr>
                        </thead>
                        <tbody>
                          ${runsSorted.map(r => `
                            <tr style="border-top:1px solid rgba(255,255,255,.06)">
                              <td style="padding:8px 10px">${esc(r.date || "")}</td>
                              <td style="padding:8px 10px" class="km">${Number(r.km||0).toFixed(2)}</td>
                              <td style="padding:8px 10px">
                                ${r.img ? `
                                  <a href="${esc(r.img)}" target="_blank" rel="noreferrer" style="color:var(--text);text-decoration:none">
                                    <img src="${esc(r.img)}" alt="Beweis" style="max-height:80px; border-radius:10px; border:1px solid rgba(255,255,255,.08)">
                                  </a>
                                ` : `<span class="hint" style="margin:0">—</span>`}
                              </td>
                            </tr>
                          `).join("")}
                        </tbody>
                      </table>
                    `}
                  </div>
                </td>
              </tr>
            `;

            return `
              <tr class="player-row" data-player="${esc(pr.name)}" style="cursor:pointer">
                <td style="width:26px; color:${groupColor(pr.group)}; font-weight:900">${open ? "▾" : "▸"}</td>
                <td>${trend(pr.rank_delta)}</td>
                <td>${pr.current_rank}</td>
                <td><b>${esc(pr.name)}${crown}</b></td>
                <td>
                  <span class="tag" style="border-color:${groupColor(pr.group)}; color:${groupColor(pr.group)}">
                    ${esc(pr.group)}
                  </span>
                </td>
                <td class="km">${pr.km.toFixed(2)}</td>
              </tr>
              ${details}
            `;
          }).join("")}
        </tbody>
      </table>
    `;

    // Gruppen (Accordion + Mitglieder-Ranking)
    $("groupsView").innerHTML = `
      <table>
        <thead>
          <tr>
            <th></th>
            <th>Trend</th>
            <th>Rang</th>
            <th>Gruppe</th>
            <th class="km">km</th>
          </tr>
        </thead>
        <tbody>
          ${groupRows.map(gr => {
            const isOpen = expandedGroup === gr.group;
            const members = membersOfGroupSorted(gr.group, playerRows);

            const detailsRow = `
              <tr class="group-details" data-group="${esc(gr.group)}" style="${isOpen ? "" : "display:none"}">
                <td colspan="5" style="padding:0">
                  <div style="padding:10px 10px 12px 10px; border-top:1px solid rgba(255,255,255,.06)">
                    <div style="display:flex; justify-content:space-between; align-items:flex-end; gap:10px; margin-bottom:8px">
                      <div style="font-weight:700; color:${groupColor(gr.group)}">${esc(gr.group)} – Mitglieder</div>
                      <div style="font-size:12px; color:var(--muted)">Sortiert nach km</div>
                    </div>

                    <table style="width:100%; border-collapse:collapse; background:rgba(0,0,0,.06); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-top:0">
                      <thead>
                        <tr>
                          <th style="padding:8px 10px">#</th>
                          <th style="padding:8px 10px">Spieler</th>
                          <th style="padding:8px 10px" class="km">km</th>
                        </tr>
                      </thead>
                      <tbody>
                        ${members.map((m, idx) => `
                          <tr style="border-top:1px solid rgba(255,255,255,.06)">
                            <td style="padding:8px 10px">${idx + 1}</td>
                            <td style="padding:8px 10px; font-weight:700">${esc(m.name)}${idx===0 ? `<span style="margin-left:8px">👑</span>` : ""}</td>
                            <td style="padding:8px 10px" class="km">${Number(m.km).toFixed(2)}</td>
                          </tr>
                        `).join("")}
                      </tbody>
                    </table>
                  </div>
                </td>
              </tr>
            `;

            return `
              <tr class="group-row" data-group="${esc(gr.group)}" style="cursor:pointer">
                <td style="width:26px; color:${groupColor(gr.group)}; font-weight:900">${isOpen ? "▾" : "▸"}</td>
                <td>${trend(gr.rank_delta)}</td>
                <td>${gr.current_rank}</td>
                <td><b style="color:${groupColor(gr.group)}">${esc(gr.group)}</b></td>
                <td class="km">${Number(gr.km).toFixed(2)}</td>
              </tr>
              ${detailsRow}
            `;
          }).join("")}
        </tbody>
      </table>
    `;

    // Admin wiring
    wireAdmin();
  }

  // Tabs
  window.setView = function(which){
    const pv = $("playersView");
    const gv = $("groupsView");
    const tp = $("tabPlayers");
    const tg = $("tabGroups");

    if (which === "groups"){
      pv.style.display = "none";
      gv.style.display = "block";
      tp.classList.remove("active");
      tg.classList.add("active");
    } else {
      gv.style.display = "none";
      pv.style.display = "block";
      tg.classList.remove("active");
      tp.classList.add("active");
    }
  };

  // Klick: Accordion Gruppen
  document.addEventListener("click", (e) => {
    const gr = e.target.closest?.("tr.group-row");
    if (gr){
      const group = gr.getAttribute("data-group");
      expandedGroup = (expandedGroup === group) ? null : group;
      render();
      return;
    }
    const pr = e.target.closest?.("tr.player-row");
    if (pr){
      const player = pr.getAttribute("data-player");
      expandedPlayer = (expandedPlayer === player) ? null : player;
      render();
      return;
    }
  });

  async function init(){
    const res = await fetch("data.json", { cache: "no-store" });
    DATA = await res.json();
    $("stamp").textContent = DATA.stand || "—";
    render();
  }

  init().catch(err => {
    console.error(err);
    $("playersView").innerHTML = `<div class="hint">Fehler: data.json konnte nicht geladen werden. Prüfe, ob die Datei im Repo liegt.</div>`;
  });
</script>
