<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Laufchallenge</title>

  <style>
    :root{
      --bg:#0b0f14;
      --card:#121925;
      --card2:#0f1520;
      --border:#233044;
      --text:#e8eef7;
      --muted:#9aa7b6;

      --good:#22c55e;
      --bad:#ff6b6b;
      --warn:#facc15;

      /* Logo als Hintergrund (dezent) */
      --logo-url: url("uploads/logo.png");
    }

    *{ box-sizing:border-box; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; }
    body{
      margin:0;
      background:
        radial-gradient(1200px 600px at 20% 0%, #142033 0%, var(--bg) 55%),
        var(--bg);
      color:var(--text);
      padding:18px;
    }

    /* Hintergrund-Logo nur als Watermark, ohne Layout zu killen */
    body::before{
      content:"";
      position:fixed;
      inset:auto -140px -160px auto;
      width:520px;
      height:520px;
      background-image: var(--logo-url);
      background-repeat:no-repeat;
      background-position:center;
      background-size:contain;
      opacity:.06;
      filter: grayscale(1) contrast(1.15);
      transform: rotate(-8deg);
      pointer-events:none;
      z-index:0;
    }

    .wrap{ position:relative; z-index:1; max-width:1100px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
    .top{ display:flex; gap:12px; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; }
    h1{ margin:0; font-size:22px; letter-spacing:.2px; }
    .sub{ color:var(--muted); font-size:12px; margin-top:6px; }

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.03), transparent), var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:14px;
    }
    .side{ background: linear-gradient(180deg, rgba(255,255,255,.02), transparent), var(--card2); }

    .tabs{
      display:inline-flex; border:1px solid var(--border); border-radius:999px; overflow:hidden;
      background:rgba(255,255,255,.02);
    }
    .tab{
      padding:9px 12px; font-size:13px; border:0; color:var(--text); background:transparent; cursor:pointer;
    }
    .tab.active{ outline:2px solid rgba(96,165,250,.55); outline-offset:-2px; background:rgba(34,197,94,.14); color:#dff7e8; }

    .grid2{ display:grid; grid-template-columns:1fr; gap:12px; }
    @media (min-width:860px){ .grid2{ grid-template-columns:1.3fr .7fr; } }

    .metaRowTop{
      display:flex;
      gap:12px;
      align-items:flex-start;
      justify-content:space-between;
      flex-wrap:wrap;
      margin-bottom:10px;
    }

    .metaLeft{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .logoBadge{
      display:flex;
      align-items:center;
      justify-content:center;
      width:56px;
      height:56px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.03);
      box-shadow:0 18px 40px rgba(0,0,0,.35);
      overflow:hidden;
    }
    .logoBadge img{
      width:44px;
      height:44px;
      object-fit:contain;
      display:block;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,.35));
    }

    .pill{
      border:1px solid var(--border);
      background:rgba(255,255,255,.02);
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      color:var(--muted);
      display:inline-flex;
      gap:8px;
      align-items:center;
    }
    .pill b{ color:var(--text); }
    .pillCol{ display:flex; flex-direction:column; line-height:1.2; }

    .pillLeft{
      border-color:rgba(239,68,68,.35);
      background:rgba(239,68,68,.10);
      color:#fecaca;
      font-weight:800;
    }

    /* Daily fun line */
    .dailyLine{
      margin:8px 0 4px 0;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.03);
      color:rgba(232,238,247,.92);
      font-size:13px;
      display:flex;
      gap:10px;
      align-items:flex-start;
    }
    .dailyLine .dot{
      width:8px;
      height:8px;
      border-radius:999px;
      background:rgba(34,197,94,.9);
      margin-top:6px;
      flex:0 0 auto;
    }

    /* Stats lines */
    .statLine{
      margin:6px 0;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .badge{
      display:inline-flex;
      gap:8px;
      align-items:center;
      padding:6px 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.03);
      font-size:13px;
      color:var(--muted);
      font-weight:700;
    }
    .badge b{ color:var(--text); }
    .badgeMini{
      display:inline-flex;
      gap:6px;
      align-items:center;
      padding:3px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight:800;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.05);
      color:var(--text);
      white-space:nowrap;
    }
    .badgeMini.blue{ border-color:rgba(96,165,250,.5); background:rgba(96,165,250,.16); }
    .badgeMini.green{ border-color:rgba(34,197,94,.5); background:rgba(34,197,94,.14); }
    .badgeMini.yellow{ border-color:rgba(250,204,21,.5); background:rgba(250,204,21,.12); }

    /* Podium */
    .podium{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:12px;
      margin-top:8px;
    }
    @media (max-width:700px){
      .podium{ grid-template-columns:1fr; }
    }
    .podiumCard{
      border-radius:18px;
      padding:14px;
      border:2px solid rgba(255,255,255,.07);
      background:rgba(255,255,255,.02);
      position:relative;
      overflow:hidden;
    }
    .podiumCard.p1{ border-color:rgba(34,197,94,.45); }
    .podiumCard.p2{ border-color:rgba(148,163,184,.35); }
    .podiumCard.p3{ border-color:rgba(250,204,21,.35); }
    .podiumLabel{ color:var(--muted); font-size:12px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; }
    .podiumName{ margin-top:10px; font-size:18px; font-weight:950; }
    .podiumMeta{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
    .groupTag{
      font-size:12px; font-weight:900;
      border:1px solid rgba(255,255,255,.12);
      padding:4px 10px; border-radius:999px;
      background:rgba(255,255,255,.02);
    }
    .kmPill{
      font-variant-numeric:tabular-nums;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid rgba(34,197,94,.35);
      background:rgba(34,197,94,.12);
      color:#dff7e8;
      font-weight:900;
    }

    .hint{ color:var(--muted); font-size:12px; line-height:1.4; margin-top:10px; }

    /* Tabellen + Mobile Fix (Problem 3) */
    .tableWrap{
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      border-radius:14px;
      border:1px solid var(--border);
      background:rgba(0,0,0,.06);
      margin-top:10px;
    }
    table{
      width:100%;
      border-collapse:collapse;
      min-width:760px; /* sorgt dafür, dass am Handy nix abgeschnitten wird */
    }
    th,td{ padding:10px; border-bottom:1px solid rgba(255,255,255,.06); text-align:left; vertical-align:top; }
    th{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); background:rgba(255,255,255,.02); }
    tr:last-child td{ border-bottom:0; }

    @media (max-width:560px){
      th,td{ padding:8px; }
      table{ min-width:720px; }
    }

    .km{ font-variant-numeric:tabular-nums; white-space:nowrap; }
    .trend{ font-variant-numeric:tabular-nums; white-space:nowrap; }
    .up{ color:var(--good); } .down{ color:var(--bad); } .same{ color:var(--muted); }

    .rowclick{ cursor:pointer; }
    .caret{ width:26px; font-weight:950; }
    img.proof{ max-height:90px; border-radius:10px; border:1px solid rgba(255,255,255,.10); display:block; }
    code{ padding:1px 6px; border:1px solid rgba(255,255,255,.1); border-radius:8px; background:rgba(255,255,255,.03); }

    /* Sidebar */
    .list{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
    .li > div{
      width:100%;
      padding:10px 12px;
      border:1px solid rgba(255,255,255,.06);
      border-radius:14px;
      background:rgba(255,255,255,.02);
    }
    .li small{ color:var(--muted); }

    /* Admin */
    select,input,button{ font:inherit; }
    .adminGrid{ display:grid; gap:10px; grid-template-columns:1fr 160px 1fr; align-items:end; }
    @media (max-width:720px){ .adminGrid{ grid-template-columns:1fr; } }
    .inp,.sel{
      width:100%; padding:10px; border-radius:12px; border:1px solid var(--border);
      background:rgba(255,255,255,.02); color:var(--text);
    }
    .btn{
      padding:10px 14px; border-radius:14px; border:1px solid var(--border);
      background:rgba(255,255,255,.02); color:var(--text); cursor:pointer; font-weight:900;
    }
    .btnGood{ background:rgba(34,197,94,.15); color:#dff7e8; font-weight:950; }
    .btnBad{ background:rgba(255,107,107,.12); color:#ffd6d6; font-weight:950; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>⚽ Laufchallenge</h1>
        <div class="sub">Einzelrangliste & Gruppenübersicht · sortiert nach Strecke · Klick für Details</div>
      </div>

      <div class="tabs" role="tablist">
        <button class="tab active" id="tabPlayers" type="button">Einzel</button>
        <button class="tab" id="tabGroups" type="button">Gruppen</button>
      </div>
    </div>

    <div class="grid2">
      <div class="card" id="mainCard">

        <div class="metaRowTop">
          <div class="metaLeft">
            <div class="logoBadge" title="Vereinslogo">
              <img src="uploads/logo.png" alt="Vereinslogo">
            </div>

            <div class="pill">
              <div class="pillCol">
                <div>Start: <b id="startDate">—</b></div>
                <div>Ende: <b id="endDate">—</b></div>
              </div>
            </div>
          </div>

          <div class="pill pillLeft">⏳ <span><b id="daysLeft">—</b> left</span></div>
        </div>

        <div class="dailyLine" id="dailyLine">
          <span class="dot"></span>
          <div>—</div>
        </div>

        <div class="statLine">
          <span class="badgeMini blue" id="longestRunBadge">🏃 Längste Einzelstrecke: —</span>
        </div>

        <div class="statLine" style="justify-content:center">
          <span class="badge" id="leaderStreakBadge">🏁 Leader-Streak: —</span>
        </div>

        <div id="podiumMount"></div>

        <div id="adminBarMount"></div>

        <div id="playersView"></div>
        <div id="groupsView" style="display:none"></div>
      </div>

      <div class="card side">
        <div style="font-weight:950; font-size:18px">Gruppen</div>
        <div class="hint">Liste der Gruppen & Mitglieder.</div>
        <div class="list" id="groupList"></div>
        <div class="hint" style="margin-top:12px">Daten aus <code>data.json</code>. Bilder aus <code>/uploads/uploads</code>.</div>
      </div>
    </div>
  </div>

  <script>
    // ====== STATE ======
    let DATA = null;
    let expandedGroup = null;
    let expandedPlayer = null;

    // ====== ADMIN PASS (nur Klickschutz, nicht echte Sicherheit) ======
    const ADMIN_PASSWORD = "14492";
    const ADMIN_SESSION_KEY = "laufchallenge_admin_ok";

    // Doppelte uploads-Struktur (wie du es willst)
    const UPLOADS_BASE = "uploads/uploads";

    // ====== HELPERS ======
    const $ = (id) => document.getElementById(id);

    function esc(s){
      return String(s).replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[m]));
    }

    // ISO -> TT.MM.JJJJ (lokal, ohne UTC-Shift)
    function formatDateDE(iso){
      if (!iso) return "—";
      const parts = String(iso).split("-");
      if (parts.length !== 3) return esc(iso);
      const y = Number(parts[0]), m = Number(parts[1]), d = Number(parts[2]);
      if (!y || !m || !d) return esc(iso);
      const dt = new Date(y, m-1, d);
      return dt.toLocaleDateString("de-DE");
    }

    function toISODateLocal(d){
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,"0");
      const day = String(d.getDate()).padStart(2,"0");
      return `${y}-${m}-${day}`;
    }

    function adminModeEnabled(){
      if (location.hash !== "#admin") return false;
      if (sessionStorage.getItem(ADMIN_SESSION_KEY) === "1") return true;

      const pw = prompt("Admin-Passwort:");
      if (pw === ADMIN_PASSWORD){
        sessionStorage.setItem(ADMIN_SESSION_KEY, "1");
        return true;
      }
      alert("Falsches Passwort.");
      return false;
    }

    function adminLogout(){
      sessionStorage.removeItem(ADMIN_SESSION_KEY);
      if (location.hash === "#admin") history.replaceState(null, "", location.pathname + location.search);
      render();
    }

    function groupColor(name){
      return (DATA && DATA.colors && DATA.colors[name]) ? DATA.colors[name] : "#94a3b8";
    }

    function trend(delta){
      if (delta > 0) return `<span class="trend up">▲ ${delta}</span>`;
      if (delta < 0) return `<span class="trend down">▼ ${Math.abs(delta)}</span>`;
      return `<span class="trend same">—</span>`;
    }

    function denseRank(sorted, keyFn){
      let rank = 0, last = null;
      return sorted.map(x => {
        const v = keyFn(x);
        if (last === null || v !== last) rank++;
        last = v;
        return { ...x, current_rank: rank };
      });
    }

    function buildNameToGroup(){
      const map = new Map();
      for (const g of (DATA.groups || [])) for (const m of (g.members || [])) map.set(m, g.name);
      return map;
    }

    function totalKmForPlayer(p){
      const runs = Array.isArray(p.runs) ? p.runs : [];
      let sum = 0;
      for (const r of runs) sum += Number(r.km || 0);
      return Number(sum.toFixed(2));
    }

    function buildPlayerRows(){
      const nameToGroup = buildNameToGroup();

      const rows = (DATA.players || []).map(p => ({
        name: p.name,
        group: nameToGroup.get(p.name) || "—",
        km: totalKmForPlayer(p),
        previousRank: (p.previousRank ?? null),
        runs: Array.isArray(p.runs) ? p.runs : []
      })).sort((a,b) => (b.km - a.km) || a.name.localeCompare(b.name));

      const ranked = denseRank(rows, r => r.km);

      return ranked.map(r => {
        const prev = (r.previousRank == null) ? r.current_rank : r.previousRank;
        return { ...r, rank_delta: prev - r.current_rank };
      });
    }

    // ====== Problem 2 (Gruppen-Trend) + Variante B ======
    function buildGroupRows(playerRows){
      const totals = new Map((DATA.groups || []).map(g => [g.name, 0]));
      for (const p of playerRows){
        if (totals.has(p.group)) totals.set(p.group, totals.get(p.group) + p.km);
      }

      const rows = Array.from(totals.entries())
        .map(([group, km]) => ({ group, km: Number(km.toFixed(2)) }))
        .sort((a,b) => (b.km - a.km) || a.group.localeCompare(b.group));

      const ranked = denseRank(rows, r => r.km);

      const prevMap = new Map((DATA.groups || []).map(g => [g.name, (g.previousRank ?? null)]));

      return ranked.map(r => {
        const prev = prevMap.get(r.group);
        const usedPrev = (prev == null) ? r.current_rank : prev;
        return { ...r, rank_delta: usedPrev - r.current_rank };
      });
    }

    function membersOfGroupSorted(groupName, playerRows){
      const g = (DATA.groups || []).find(x => x.name === groupName);
      const members = g ? (g.members || []) : [];
      const kmByName = new Map(playerRows.map(p => [p.name, p.km]));
      return members
        .map(name => ({ name, km: kmByName.get(name) ?? 0 }))
        .sort((a,b) => (b.km - a.km) || a.name.localeCompare(b.name));
    }

    function playerFolder(playerName){
      return playerName
        .toLowerCase()
        .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
        .replace(/[^a-z0-9]+/g,"_")
        .replace(/^_+|_+$/g,"");
    }

    function calcDaysLeft(startISO, endISO){
      if (!startISO || !endISO) return null;
      const s = startISO.split("-").map(Number);
      const e = endISO.split("-").map(Number);
      if (s.length!==3 || e.length!==3) return null;

      const start = new Date(s[0], s[1]-1, s[2]);
      const end = new Date(e[0], e[1]-1, e[2]);
      const today = new Date();
      const t = new Date(today.getFullYear(), today.getMonth(), today.getDate());

      const totalDays = Math.round((end - start) / 86400000) + 1;
      const passed = Math.round((t - start) / 86400000);
      const left = totalDays - passed;
      return Math.max(0, left);
    }

    function longestSingleRun(){
      let best = { name:null, km:0, date:null };
      for (const p of (DATA.players || [])){
        const runs = Array.isArray(p.runs) ? p.runs : [];
        for (const r of runs){
          const km = Number(r.km || 0);
          if (km > best.km){
            best = { name:p.name, km, date:r.date || null };
          }
        }
      }
      return best;
    }

    // Daily fun line (deterministisch pro Tag)
    function mulberry32(seed){
      return function(){
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function makeDailyLine(playerRows){
      const today = new Date();
      const isoToday = toISODateLocal(today);

      const seed = Number(isoToday.replaceAll("-","")) || 1;
      const rnd = mulberry32(seed);

      // stats:
      // most runs overall
      let mostRuns = { name:null, cnt:0 };
      for (const pr of playerRows){
        const cnt = (pr.runs || []).length;
        if (cnt > mostRuns.cnt) mostRuns = { name: pr.name, cnt };
      }

      // yesterday least km
      const y = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 1);
      const isoY = toISODateLocal(y);
      let leastY = { name:null, km:Infinity };
      let anyY = false;

      for (const pr of playerRows){
        let sum = 0;
        for (const r of (pr.runs || [])){
          if (String(r.date||"") === isoY) sum += Number(r.km || 0);
        }
        if (sum > 0) anyY = true;
        if (sum < leastY.km){
          leastY = { name: pr.name, km: sum };
        }
      }

      // biggest rank up today (using current rank_delta)
      let bestDelta = { name:null, d:0 };
      for (const pr of playerRows){
        if (pr.rank_delta > bestDelta.d){
          bestDelta = { name: pr.name, d: pr.rank_delta };
        }
      }

      // group comparison fun: pick a player and compare to a random group total
      const groupTotals = buildGroupRows(playerRows); // has km
      const anyGroup = groupTotals.length ? groupTotals[Math.floor(rnd()*groupTotals.length)] : null;

      const lines = [];

      if (anyY && leastY.name){
        lines.push(`Gestern ist <b>${esc(leastY.name)}</b> am wenigsten gelaufen (${leastY.km.toFixed(2)} km).`);
      } else {
        lines.push(`Auf geht’s Jungs – heute wird gesammelt! 💪`);
      }

      if (mostRuns.name && mostRuns.cnt > 0){
        lines.push(`<b>${esc(mostRuns.name)}</b> hat bisher die meisten Läufe (${mostRuns.cnt}).`);
      }

      if (bestDelta.name && bestDelta.d >= 2){
        lines.push(`Heute hat <b>${esc(bestDelta.name)}</b> <b>${bestDelta.d}</b> Plätze gutgemacht. 🚀`);
      } else {
        // fallback
        const leader = playerRows[0];
        if (leader) lines.push(`<b>${esc(leader.name)}</b> hält gerade Platz 1 – wer greift an? 👀`);
      }

      if (anyGroup && playerRows.length){
        const pick = playerRows[Math.floor(rnd()*playerRows.length)];
        if (pick && anyGroup){
          lines.push(`<b>${esc(pick.name)}</b> läuft fast so viel wie <b>${esc(anyGroup.group)}</b> zusammen. 😅`);
        }
      }

      // pick one line per day
      const idx = Math.floor(rnd() * lines.length);
      return lines[idx] || `Auf geht’s Jungs – Gas geben!`;
    }

    function calcLeaderStreak(playerRows){
      // einfache Version: wenn data.json ein Feld "leaderStreakDays" + "leaderName" hat, nutzen.
      // ansonsten: fallback "1 Tage" für aktuellen #1 (weil echte Streak ohne History schwer).
      const leader = playerRows[0];
      if (!leader) return { name:"—", days:0 };

      if (DATA.leaderStreak && DATA.leaderStreak.name && Number.isFinite(DATA.leaderStreak.days)){
        return { name: DATA.leaderStreak.name, days: Number(DATA.leaderStreak.days) };
      }

      return { name: leader.name, days: 1 };
    }

    function buildPodium(playerRows){
      const top3 = playerRows.slice(0,3);
      if (!top3.length) return "";

      const cards = top3.map((p, i) => {
        const cls = i===0 ? "p1" : (i===1 ? "p2" : "p3");
        const label = i===0 ? "Platz 1" : (i===1 ? "Platz 2" : "Platz 3");
        const medal = i===0 ? "👑" : (i===1 ? "🥈" : "🥉");
        return `
          <div class="podiumCard ${cls}">
            <div class="podiumLabel">${label}</div>
            <div class="podiumName">${esc(p.name)} <span title="${label}">${medal}</span></div>
            <div class="podiumMeta">
              <span class="groupTag" style="border-color:${groupColor(p.group)}; color:${groupColor(p.group)}">
                ${esc(p.group)}
              </span>
              <span class="kmPill">${p.km.toFixed(2)} km</span>
            </div>
          </div>
        `;
      }).join("");

      return `
        <div class="podium">${cards}</div>
        <div class="hint" style="margin-top:10px">Ab Platz 4 geht’s in der Tabelle weiter.</div>
      `;
    }

    // ====== ADMIN BAR ======
    function renderAdminBar(){
      if (!adminModeEnabled()) return "";

      const options = (DATA.players || [])
        .map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`)
        .join("");

      return `
        <div class="card" style="margin-top:12px">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-end;flex-wrap:wrap">
            <div style="font-weight:950;font-size:20px">Admin</div>
            <button id="adminLogoutBtn" class="btn btnBad" type="button">Admin verlassen</button>
          </div>

          <div class="adminGrid" style="margin-top:10px">
            <div>
              <div class="hint" style="margin:0 0 4px 0">Spieler</div>
              <select id="adminPlayer" class="sel">${options}</select>
            </div>

            <div>
              <div class="hint" style="margin:0 0 4px 0">Strecke (km)</div>
              <input id="adminKm" class="inp" type="number" step="0.01" value="0">
            </div>

            <div>
              <div class="hint" style="margin:0 0 4px 0">Datum</div>
              <input id="adminDate" class="inp" type="date">
            </div>
          </div>

          <div style="display:grid; gap:10px; grid-template-columns:1fr 220px; align-items:end; margin-top:10px">
            <div>
              <div class="hint" style="margin:0 0 4px 0">Bild-Dateiname (im Spieler-Ordner)</div>
              <input id="adminImgName" class="inp" placeholder="Run1.jpg">
              <div class="hint" style="margin-top:6px">
                Upload nach: <code id="uploadPathHint">—</code>
              </div>
            </div>

            <div>
              <div class="hint" style="margin:0 0 4px 0">Rank für Trend speichern</div>
              <input id="adminRank" class="inp" type="number" step="1" placeholder="(optional)">
              <div class="hint" style="margin-top:6px">Schreibt <code>previousRank</code> beim Spieler.</div>
            </div>
          </div>

          <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; align-items:center; justify-content:flex-end">
            <button id="adminAdd" class="btn btnGood" type="button" style="min-width:220px">Lauf hinzufügen</button>
          </div>

          <div id="adminHint" class="hint" style="margin-top:10px"></div>

          <div style="display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; align-items:center">
            <button id="adminDownload" class="btn" type="button">data.json herunterladen</button>
            <div class="hint" style="margin:0">Danach <code>data.json</code> + Bild in GitHub hochladen.</div>
          </div>
        </div>
      `;
    }

    function wireAdmin(){
      if (!adminModeEnabled()) return;

      const todayISO = toISODateLocal(new Date());
      $("adminDate").value = todayISO;

      const updatePathHint = () => {
        const player = $("adminPlayer").value.trim();
        const folder = playerFolder(player);
        $("uploadPathHint").textContent = `${UPLOADS_BASE}/${folder}/`;
      };

      $("adminPlayer").addEventListener("change", updatePathHint);
      updatePathHint();

      $("adminLogoutBtn").addEventListener("click", adminLogout);

      $("adminAdd").addEventListener("click", () => {
        const playerName = $("adminPlayer").value.trim();
        const km = Number($("adminKm").value || 0);
        const date = $("adminDate").value;
        const imgName = $("adminImgName").value.trim();
        const rankInput = $("adminRank").value.trim();

        if (!playerName || !date || !Number.isFinite(km) || km <= 0){
          $("adminHint").textContent = "Bitte Spieler, Datum und Strecke > 0 ausfüllen.";
          return;
        }
        if (!imgName){
          $("adminHint").textContent = "Bitte Bild-Dateiname eintragen (z.B. Run1.jpg).";
          return;
        }

        const p = (DATA.players || []).find(x => x.name === playerName);
        if (!p){
          $("adminHint").textContent = "Spieler nicht gefunden.";
          return;
        }
        if (!Array.isArray(p.runs)) p.runs = [];

        const folder = playerFolder(playerName);
        // ====== Problem 1 Fix: immer in uploads/uploads/<spieler>/... speichern ======
        const imgPath = `${UPLOADS_BASE}/${folder}/${imgName}`;

        p.runs.push({ date, km: Number(km.toFixed(2)), img: imgPath });

        // optional: previousRank setzen
        if (rankInput){
          const pr = Number(rankInput);
          if (Number.isFinite(pr) && pr > 0) p.previousRank = pr;
        }

        $("adminHint").innerHTML =
          `✅ Lauf hinzugefügt (lokal).<br>` +
          `1) Lade das Bild als <code>${esc(imgName)}</code> nach <code>${esc(UPLOADS_BASE)}/${esc(folder)}/</code> hoch.<br>` +
          `2) Klick <b>data.json herunterladen</b> und ersetze die Datei im Repo.`;

        render();
      });

      // ====== Variante B: beim Download previousRank für Spieler + Gruppen automatisch setzen ======
      $("adminDownload").addEventListener("click", () => {
        const playerRows = buildPlayerRows();
        const groupRows  = buildGroupRows(playerRows);

        for (const pr of playerRows){
          const p = (DATA.players || []).find(x => x.name === pr.name);
          if (p) p.previousRank = pr.current_rank;
        }
        for (const gr of groupRows){
          const g = (DATA.groups || []).find(x => x.name === gr.group);
          if (g) g.previousRank = gr.current_rank;
        }

        const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "data.json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      });
    }

    // ====== RENDER ======
    function render(){
      // Start/Ende/Days left
      const startISO = DATA.start || DATA.startDate || "2026-01-11";
      const endISO   = DATA.end   || DATA.endDate   || "2026-01-31";

      $("startDate").textContent = formatDateDE(startISO);
      $("endDate").textContent = formatDateDE(endISO);

      const left = calcDaysLeft(startISO, endISO);
      $("daysLeft").textContent = (left == null) ? "—" : String(left);

      // Admin Mount
      $("adminBarMount").innerHTML = renderAdminBar();

      // Sidebar groups
      $("groupList").innerHTML = (DATA.groups || []).map(g => `
        <div class="li">
          <div>
            <b style="color:${groupColor(g.name)}">${esc(g.name)}</b><br>
            <small>${(g.members||[]).map(esc).join(", ")}</small>
          </div>
        </div>
      `).join("");

      const playerRows = buildPlayerRows();
      const groupRows = buildGroupRows(playerRows);

      // Daily line
      $("dailyLine").innerHTML = `<span class="dot"></span><div>${makeDailyLine(playerRows)}</div>`;

      // Longest single run badge
      const lr = longestSingleRun();
      if (lr.name){
        $("longestRunBadge").innerHTML = `🏃 Längste Einzelstrecke: <b>${esc(lr.name)}</b> · <b>${Number(lr.km).toFixed(2)} km</b>`;
      } else {
        $("longestRunBadge").textContent = `🏃 Längste Einzelstrecke: —`;
      }

      // Leader streak badge
      const ls = calcLeaderStreak(playerRows);
      $("leaderStreakBadge").innerHTML = `🏁 Leader-Streak: <b>${esc(ls.name)}</b> · <b>${Number(ls.days).toFixed(0)} Tage</b>`;

      // Podium
      $("podiumMount").innerHTML = buildPodium(playerRows);

      // Players view (Problem 3: tableWrap)
      $("playersView").innerHTML = `
        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th></th>
                <th>Trend</th>
                <th>Rang</th>
                <th>Spieler</th>
                <th>Gruppe</th>
                <th class="km">Strecke</th>
              </tr>
            </thead>
            <tbody>
              ${playerRows.map(pr => {
                const open = expandedPlayer === pr.name;
                const medal = pr.current_rank === 1 ? "👑" : (pr.current_rank === 2 ? "🥈" : (pr.current_rank === 3 ? "🥉" : ""));
                const runsSorted = [...(pr.runs||[])].sort((a,b) => String(b.date||"").localeCompare(String(a.date||"")));

                const details = `
                  <tr class="player-details" data-player="${esc(pr.name)}" style="${open ? "" : "display:none"}">
                    <td colspan="6" style="padding:0">
                      <div style="padding:12px; border-top:1px solid rgba(255,255,255,.06)">
                        <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-end;margin-bottom:8px;flex-wrap:wrap">
                          <div style="font-weight:950;font-size:18px">${esc(pr.name)} – Läufe</div>
                          <div style="font-size:12px;color:var(--muted)">Gesamt: ${pr.km.toFixed(2)} km</div>
                        </div>

                        ${runsSorted.length === 0 ? `
                          <div class="hint" style="margin:0">Noch keine Läufe eingetragen.</div>
                        ` : `
                          <div class="tableWrap" style="margin-top:0">
                            <table style="min-width:680px">
                              <thead>
                                <tr>
                                  <th>Run</th>
                                  <th>Datum</th>
                                  <th class="km">Strecke</th>
                                  <th>Beweis</th>
                                </tr>
                              </thead>
                              <tbody>
                                ${runsSorted.map((r, idx) => `
                                  <tr>
                                    <td>${idx+1}</td>
                                    <td>${formatDateDE(r.date || "")}</td>
                                    <td class="km">${Number(r.km||0).toFixed(2)} km</td>
                                    <td>
                                      ${r.img ? `
                                        <a href="${esc(r.img)}" target="_blank" rel="noreferrer" style="color:var(--text);text-decoration:none">
                                          <img class="proof" src="${esc(r.img)}" alt="Beweis">
                                        </a>
                                      ` : `<span class="hint" style="margin:0">—</span>`}
                                    </td>
                                  </tr>
                                `).join("")}
                              </tbody>
                            </table>
                          </div>
                        `}
                      </div>
                    </td>
                  </tr>
                `;

                return `
                  <tr class="player-row rowclick" data-player="${esc(pr.name)}">
                    <td class="caret" style="color:${groupColor(pr.group)}">${open ? "▾" : "▸"}</td>
                    <td>${trend(pr.rank_delta)}</td>
                    <td>${pr.current_rank}</td>
                    <td><b>${esc(pr.name)}</b> <span title="Top">${medal}</span></td>
                    <td>
                      <span class="groupTag" style="border-color:${groupColor(pr.group)}; color:${groupColor(pr.group)}">
                        ${esc(pr.group)}
                      </span>
                    </td>
                    <td class="km">${pr.km.toFixed(2)} km</td>
                  </tr>
                  ${details}
                `;
              }).join("")}
            </tbody>
          </table>
        </div>
      `;

      // Groups view (Problem 2: Trend + Problem 3: tableWrap)
      $("groupsView").innerHTML = `
        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th></th>
                <th>Trend</th>
                <th>Rang</th>
                <th>Gruppe</th>
                <th class="km">Strecke</th>
              </tr>
            </thead>
            <tbody>
              ${groupRows.map(gr => {
                const open = expandedGroup === gr.group;
                const members = membersOfGroupSorted(gr.group, playerRows);

                const details = `
                  <tr class="group-details" data-group="${esc(gr.group)}" style="${open ? "" : "display:none"}">
                    <td colspan="5" style="padding:0">
                      <div style="padding:12px; border-top:1px solid rgba(255,255,255,.06)">
                        <div style="display:flex; justify-content:space-between; align-items:flex-end; gap:10px; margin-bottom:8px; flex-wrap:wrap">
                          <div style="font-weight:950; font-size:18px; color:${groupColor(gr.group)}">${esc(gr.group)} – Mitglieder</div>
                          <div style="font-size:12px; color:var(--muted)">Sortiert nach Strecke</div>
                        </div>

                        <div class="tableWrap" style="margin-top:0">
                          <table style="min-width:560px">
                            <thead>
                              <tr>
                                <th>#</th>
                                <th>Spieler</th>
                                <th class="km">Strecke</th>
                              </tr>
                            </thead>
                            <tbody>
                              ${members.map((m, idx) => `
                                <tr>
                                  <td>${idx+1}</td>
                                  <td style="font-weight:900">${esc(m.name)}${idx===0 ? ` <span title="Top in Gruppe">👑</span>` : ""}</td>
                                  <td class="km">${Number(m.km).toFixed(2)} km</td>
                                </tr>
                              `).join("")}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </td>
                  </tr>
                `;

                return `
                  <tr class="group-row rowclick" data-group="${esc(gr.group)}">
                    <td class="caret" style="color:${groupColor(gr.group)}">${open ? "▾" : "▸"}</td>
                    <td>${trend(gr.rank_delta)}</td>
                    <td>${gr.current_rank}</td>
                    <td><b style="color:${groupColor(gr.group)}">${esc(gr.group)}</b></td>
                    <td class="km">${Number(gr.km).toFixed(2)} km</td>
                  </tr>
                  ${details}
                `;
              }).join("")}
            </tbody>
          </table>
        </div>
      `;

      wireAdmin();
    }

    // ====== VIEW SWITCH ======
    function setView(which){
      const pv = $("playersView");
      const gv = $("groupsView");
      const tp = $("tabPlayers");
      const tg = $("tabGroups");

      if (which === "groups"){
        pv.style.display = "none";
        gv.style.display = "block";
        tp.classList.remove("active");
        tg.classList.add("active");
      } else {
        gv.style.display = "none";
        pv.style.display = "block";
        tg.classList.remove("active");
        tp.classList.add("active");
      }
    }

    $("tabPlayers").addEventListener("click", () => setView("players"));
    $("tabGroups").addEventListener("click", () => setView("groups"));

    // Accordions
    document.addEventListener("click", (e) => {
      const pr = e.target.closest && e.target.closest("tr.player-row");
      if (pr){
        const name = pr.getAttribute("data-player");
        expandedPlayer = (expandedPlayer === name) ? null : name;
        render();
        return;
      }
      const gr = e.target.closest && e.target.closest("tr.group-row");
      if (gr){
        const name = gr.getAttribute("data-group");
        expandedGroup = (expandedGroup === name) ? null : name;
        render();
      }
    });

    // ====== INIT ======
    async function init(){
      const res = await fetch("data.json", { cache: "no-store" });
      if (!res.ok) throw new Error("data.json nicht gefunden (Status " + res.status + ")");
      DATA = await res.json();
      if (!DATA.groups || !DATA.players) throw new Error("data.json fehlt groups/players");

      render();
    }

    document.addEventListener("DOMContentLoaded", () => {
      init().catch(err => {
        console.error(err);
        $("playersView").innerHTML =
          `<div class="hint">Fehler: ${esc(err.message)}<br>Prüfe, ob <code>data.json</code> im Repo-Root liegt und gültiges JSON ist.</div>`;
      });
    });
  </script>
</body>
</html>
