<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Laufchallenge</title>
  <style>
    :root{
      --bg:#0b0f14;
      --card:#121925;
      --card2:#0f1520;
      --border:#233044;
      --text:#e8eef7;
      --muted:#9aa7b6;
      --good:#22c55e;
      --bad:#ff6b6b;
    }
    *{ box-sizing:border-box; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; }
    body{
      margin:0;
      background: radial-gradient(1200px 600px at 20% 0%, #142033 0%, var(--bg) 55%), var(--bg);
      color:var(--text);
      padding:18px;
    }
    .wrap{ max-width:980px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
    .top{ display:flex; gap:12px; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; }
    h1{ margin:0; font-size:22px; letter-spacing:.2px; }
    .sub{ color:var(--muted); font-size:12px; margin-top:6px; }
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.03), transparent), var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:14px;
    }
    .side{ background: linear-gradient(180deg, rgba(255,255,255,.02), transparent), var(--card2); }
    .tabs{
      display:inline-flex; border:1px solid var(--border); border-radius:999px; overflow:hidden;
      background:rgba(255,255,255,.02);
    }
    .tab{
      padding:9px 12px; font-size:13px; border:0; color:var(--text); background:transparent; cursor:pointer;
    }
    .tab.active{ background:rgba(34,197,94,.15); color:#dff7e8; }
    .metaRow{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-top:8px; }
    .pill{ border:1px solid var(--border); background:rgba(255,255,255,.02); padding:5px 10px; border-radius:999px; font-size:12px; color:var(--muted); }
    .pill b{ color:var(--text); }
    .grid2{ display:grid; grid-template-columns:1fr; gap:12px; }
    @media (min-width:860px){ .grid2{ grid-template-columns:1.3fr .7fr; } }

    table{ width:100%; border-collapse:collapse; margin-top:10px; background:rgba(0,0,0,.06);
      border:1px solid var(--border); border-radius:14px; overflow:hidden; }
    th,td{ padding:10px; border-bottom:1px solid rgba(255,255,255,.06); text-align:left; vertical-align:top; }
    th{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); background:rgba(255,255,255,.02); }
    tr:last-child td{ border-bottom:0; }
    .km{ font-variant-numeric:tabular-nums; }
    .trend{ font-variant-numeric:tabular-nums; white-space:nowrap; }
    .up{ color:var(--good); } .down{ color:var(--bad); } .same{ color:var(--muted); }
    .tag{
      font-size:11px; color:var(--muted);
      border:1px solid rgba(255,255,255,.08);
      padding:2px 8px; border-radius:999px; background:rgba(255,255,255,.02); display:inline-block;
    }
    .hint{ color:var(--muted); font-size:12px; line-height:1.4; margin-top:10px; }
    .list{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }
    .li{ display:flex; justify-content:space-between; gap:10px; }
    .li > div{ width:100%; padding:8px 10px; border:1px solid rgba(255,255,255,.06); border-radius:12px; background:rgba(255,255,255,.02); }
    .li small{ color:var(--muted); }

    .rowclick{ cursor:pointer; }
    .caret{ width:26px; font-weight:900; }
    img.proof{ max-height:80px; border-radius:10px; border:1px solid rgba(255,255,255,.08); display:block; }
    code{ padding:1px 6px; border:1px solid rgba(255,255,255,.1); border-radius:8px; background:rgba(255,255,255,.03); }

    select,input,button{ font:inherit; }
    .adminGrid{ display:grid; gap:8px; grid-template-columns:1fr 140px 1fr; align-items:end; }
    @media (max-width:720px){ .adminGrid{ grid-template-columns:1fr; } }
    .inp, .sel{
      width:100%; padding:8px; border-radius:10px; border:1px solid var(--border);
      background:rgba(255,255,255,.02); color:var(--text);
    }
    .btn{
      padding:10px 14px; border-radius:12px; border:1px solid var(--border);
      background:rgba(255,255,255,.02); color:var(--text); cursor:pointer; font-weight:700;
    }
    .btnGood{ background:rgba(34,197,94,.15); color:#dff7e8; font-weight:800; }
    .btnBad{ background:rgba(255,107,107,.12); color:#ffd6d6; font-weight:800; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>⚽ Laufchallenge</h1>
        <div class="sub">Einzelrangliste & Gruppenübersicht · sortiert nach km · Klick für Details</div>
      </div>

      <div class="tabs" role="tablist">
        <button class="tab active" id="tabPlayers" type="button">Einzel</button>
        <button class="tab" id="tabGroups" type="button">Gruppen</button>
      </div>
    </div>

    <div class="grid2">
      <div class="card" id="mainCard">
        <div class="metaRow">
          <div class="pill">Stand: <b id="stamp">—</b></div>
          <div class="pill">Admin: <code>#admin</code> an die URL hängen</div>
        </div>

        <div id="adminBarMount"></div>

        <div id="playersView"></div>
        <div id="groupsView" style="display:none"></div>
      </div>

      <div class="card side">
        <div style="font-weight:800">Gruppen</div>
        <div class="hint">Liste der Gruppen & Mitglieder.</div>
        <div class="list" id="groupList"></div>
        <div class="hint" style="margin-top:12px">Daten aus <code>data.json</code>. Bilder aus <code>/uploads</code>.</div>
      </div>
    </div>
  </div>

  <script>
    // ====== STATE ======
    let DATA = null;
    let expandedGroup = null;
    let expandedPlayer = null;

    // ====== ADMIN PASS (nur Klickschutz, nicht echte Sicherheit) ======
    const ADMIN_PASSWORD = "14492";
    const ADMIN_SESSION_KEY = "laufchallenge_admin_ok";

    // ====== HELPERS ======
    const $ = (id) => document.getElementById(id);

    function esc(s){
      return String(s).replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[m]));
    }

    function adminModeEnabled(){
      if (location.hash !== "#admin") return false;

      // schon freigeschaltet?
      if (sessionStorage.getItem(ADMIN_SESSION_KEY) === "1") return true;

      const pw = prompt("Admin-Passwort:");
      if (pw === ADMIN_PASSWORD){
        sessionStorage.setItem(ADMIN_SESSION_KEY, "1");
        return true;
      }
      alert("Falsches Passwort.");
      return false;
    }

    function adminLogout(){
      sessionStorage.removeItem(ADMIN_SESSION_KEY);
      // hash entfernen
      if (location.hash === "#admin") history.replaceState(null, "", location.pathname + location.search);
      render();
    }

    function groupColor(name){
      return (DATA && DATA.colors && DATA.colors[name]) ? DATA.colors[name] : "#94a3b8";
    }

    function trend(delta){
      if (delta > 0) return `<span class="trend up">▲ ${delta}</span>`;
      if (delta < 0) return `<span class="trend down">▼ ${Math.abs(delta)}</span>`;
      return `<span class="trend same">—</span>`;
    }

    function denseRank(sorted, keyFn){
      let rank = 0, last = null;
      return sorted.map(x => {
        const v = keyFn(x);
        if (last === null || v !== last) rank++;
        last = v;
        return { ...x, current_rank: rank };
      });
    }

    function buildNameToGroup(){
      const map = new Map();
      for (const g of DATA.groups) for (const m of g.members) map.set(m, g.name);
      return map;
    }

    function totalKmForPlayer(p){
      const runs = Array.isArray(p.runs) ? p.runs : [];
      let sum = 0;
      for (const r of runs) sum += Number(r.km || 0);
      return Number(sum.toFixed(2));
    }

    function buildPlayerRows(){
      const nameToGroup = buildNameToGroup();

      const rows = (DATA.players || []).map(p => ({
        name: p.name,
        group: nameToGroup.get(p.name) || "—",
        km: totalKmForPlayer(p),
        previousRank: (p.previousRank ?? null),
        runs: Array.isArray(p.runs) ? p.runs : []
      })).sort((a,b) => (b.km - a.km) || a.name.localeCompare(b.name));

      const ranked = denseRank(rows, r => r.km);

      return ranked.map(r => {
        const prev = (r.previousRank == null) ? r.current_rank : r.previousRank;
        const delta = prev - r.current_rank;
        return { ...r, rank_delta: delta };
      });
    }

    function buildGroupRows(playerRows){
      const totals = new Map((DATA.groups || []).map(g => [g.name, 0]));
      for (const p of playerRows){
        if (totals.has(p.group)) totals.set(p.group, totals.get(p.group) + p.km);
      }

      const rows = Array.from(totals.entries())
        .map(([group, km]) => ({ group, km: Number(km.toFixed(2)) }))
        .sort((a,b) => (b.km - a.km) || a.group.localeCompare(b.group));

      const ranked = denseRank(rows, r => r.km);

      // Trend für Gruppen optional später (wenn du prev ranks in data.json speicherst)
      return ranked.map(r => ({ ...r, rank_delta: 0 }));
    }

    function membersOfGroupSorted(groupName, playerRows){
      const g = (DATA.groups || []).find(x => x.name === groupName);
      const members = g ? g.members : [];
      const kmByName = new Map(playerRows.map(p => [p.name, p.km]));
      return members
        .map(name => ({ name, km: kmByName.get(name) ?? 0 }))
        .sort((a,b) => (b.km - a.km) || a.name.localeCompare(b.name));
    }

    function suggestedFileName(playerName, dateStr){
      const safe = playerName
        .toLowerCase()
        .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
        .replace(/[^a-z0-9]+/g,"_")
        .replace(/^_+|_+$/g,"");
      return `${safe}_${dateStr}.jpg`;
    }

    function downloadJson(filename, obj){
      const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    // ====== ADMIN BAR ======
    function renderAdminBar(){
      if (!adminModeEnabled()) return "";

      const options = (DATA.players || [])
        .map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`)
        .join("");

      return `
        <div class="card" style="margin-top:12px">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-end;flex-wrap:wrap">
            <div style="font-weight:900">Admin</div>
            <button id="adminLogoutBtn" class="btn btnBad" type="button">Admin verlassen</button>
          </div>

          <div class="adminGrid" style="margin-top:10px">
            <div>
              <div class="hint" style="margin:0 0 4px 0">Spieler</div>
              <select id="adminPlayer" class="sel">${options}</select>
            </div>

            <div>
              <div class="hint" style="margin:0 0 4px 0">km</div>
              <input id="adminKm" class="inp" type="number" step="0.01" value="0">
            </div>

            <div>
              <div class="hint" style="margin:0 0 4px 0">Datum</div>
              <input id="adminDate" class="inp" type="date">
            </div>
          </div>

          <div style="display:grid; gap:8px; grid-template-columns:1fr auto; align-items:end; margin-top:10px">
            <div>
              <div class="hint" style="margin:0 0 4px 0">Beweisbild-Dateiname (hochladen nach <code>/uploads</code>)</div>
              <input id="adminImgName" class="inp" placeholder="z.B. valentin_2026-01-06.jpg">
            </div>
            <button id="adminAdd" class="btn btnGood" type="button">Lauf hinzufügen</button>
          </div>

          <div id="adminHint" class="hint" style="margin-top:10px"></div>

          <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center">
            <button id="adminDownload" class="btn" type="button">data.json herunterladen</button>
            <div class="hint" style="margin:0">Danach <code>data.json</code> + Bild in GitHub hochladen → Link bleibt gleich.</div>
          </div>
        </div>
      `;
    }

    function wireAdmin(){
      if (!adminModeEnabled()) return;

      const today = new Date().toISOString().slice(0,10);
      $("adminDate").value = today;

      const updateSuggested = () => {
        const player = $("adminPlayer").value.trim();
        const date = $("adminDate").value || today;
        const sug = suggestedFileName(player, date);
        if (!$("adminImgName").value) $("adminImgName").value = sug;
      };

      $("adminPlayer").addEventListener("change", updateSuggested);
      $("adminDate").addEventListener("change", updateSuggested);
      updateSuggested();

      $("adminLogoutBtn").addEventListener("click", adminLogout);

      $("adminAdd").addEventListener("click", () => {
        const playerName = $("adminPlayer").value.trim();
        const km = Number($("adminKm").value || 0);
        const date = $("adminDate").value;
        const imgName = $("adminImgName").value.trim();

        if (!playerName || !date || !Number.isFinite(km) || km <= 0){
          $("adminHint").textContent = "Bitte Spieler, Datum und km > 0 ausfüllen.";
          return;
        }
        if (!imgName){
          $("adminHint").innerHTML = `Bitte Bild-Dateiname eintragen (z.B. <code>${esc(suggestedFileName(playerName, date))}</code>).`;
          return;
        }

        const p = (DATA.players || []).find(x => x.name === playerName);
        if (!p){
          $("adminHint").textContent = "Spieler nicht gefunden.";
          return;
        }
        if (!Array.isArray(p.runs)) p.runs = [];

        p.runs.push({ date, km: Number(km.toFixed(2)), img: `uploads/${imgName}` });

        $("adminHint").innerHTML =
          `✅ Lauf hinzugefügt (lokal).<br>` +
          `1) Lade das Bild als <code>${esc(imgName)}</code> nach <code>/uploads</code> hoch.<br>` +
          `2) Klick <b>data.json herunterladen</b> und ersetze die Datei im Repo.`;

        render();
      });

      $("adminDownload").addEventListener("click", () => downloadJson("data.json", DATA));
    }

    // ====== RENDER ======
    function render(){
      $("stamp").textContent = (DATA && DATA.stand) ? DATA.stand : "—";

      // Admin Mount
      $("adminBarMount").innerHTML = renderAdminBar();

      // Sidebar groups
      $("groupList").innerHTML = (DATA.groups || []).map(g => `
        <div class="li">
          <div>
            <b style="color:${groupColor(g.name)}">${esc(g.name)}</b><br>
            <small>${(g.members||[]).map(esc).join(", ")}</small>
          </div>
        </div>
      `).join("");

      const playerRows = buildPlayerRows();
      const groupRows = buildGroupRows(playerRows);

      // Players view
      $("playersView").innerHTML = `
        <table>
          <thead>
            <tr>
              <th></th>
              <th>Trend</th>
              <th>Rang</th>
              <th>Spieler</th>
              <th>Gruppe</th>
              <th class="km">km</th>
            </tr>
          </thead>
          <tbody>
            ${playerRows.map(pr => {
              const open = expandedPlayer === pr.name;
              const crown = pr.current_rank === 1 ? `<span title="Platz 1" style="margin-left:6px">👑</span>` : "";
              const runsSorted = [...(pr.runs||[])].sort((a,b) => String(b.date||"").localeCompare(String(a.date||"")));

              const details = `
                <tr class="player-details" data-player="${esc(pr.name)}" style="${open ? "" : "display:none"}">
                  <td colspan="6" style="padding:0">
                    <div style="padding:10px 10px 12px 10px; border-top:1px solid rgba(255,255,255,.06)">
                      <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-end;margin-bottom:8px">
                        <div style="font-weight:900">${esc(pr.name)} – Läufe</div>
                        <div style="font-size:12px;color:var(--muted)">Gesamt: ${pr.km.toFixed(2)} km</div>
                      </div>

                      ${runsSorted.length === 0 ? `
                        <div class="hint" style="margin:0">Noch keine Läufe eingetragen.</div>
                      ` : `
                        <table style="width:100%; border-collapse:collapse; background:rgba(0,0,0,.06); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-top:0">
                          <thead>
                            <tr>
                              <th>Datum</th>
                              <th class="km">km</th>
                              <th>Beweis</th>
                            </tr>
                          </thead>
                          <tbody>
                            ${runsSorted.map(r => `
                              <tr style="border-top:1px solid rgba(255,255,255,.06)">
                                <td>${esc(r.date || "")}</td>
                                <td class="km">${Number(r.km||0).toFixed(2)}</td>
                                <td>
                                  ${r.img ? `
                                    <a href="${esc(r.img)}" target="_blank" rel="noreferrer" style="color:var(--text);text-decoration:none">
                                      <img class="proof" src="${esc(r.img)}" alt="Beweis">
                                    </a>
                                  ` : `<span class="hint" style="margin:0">—</span>`}
                                </td>
                              </tr>
                            `).join("")}
                          </tbody>
                        </table>
                      `}
                    </div>
                  </td>
                </tr>
              `;

              return `
                <tr class="player-row rowclick" data-player="${esc(pr.name)}">
                  <td class="caret" style="color:${groupColor(pr.group)}">${open ? "▾" : "▸"}</td>
                  <td>${trend(pr.rank_delta)}</td>
                  <td>${pr.current_rank}</td>
                  <td><b>${esc(pr.name)}${crown}</b></td>
                  <td>
                    <span class="tag" style="border-color:${groupColor(pr.group)}; color:${groupColor(pr.group)}">
                      ${esc(pr.group)}
                    </span>
                  </td>
                  <td class="km">${pr.km.toFixed(2)}</td>
                </tr>
                ${details}
              `;
            }).join("")}
          </tbody>
        </table>
      `;

      // Groups view
      $("groupsView").innerHTML = `
        <table>
          <thead>
            <tr>
              <th></th>
              <th>Trend</th>
              <th>Rang</th>
              <th>Gruppe</th>
              <th class="km">km</th>
            </tr>
          </thead>
          <tbody>
            ${groupRows.map(gr => {
              const open = expandedGroup === gr.group;
              const members = membersOfGroupSorted(gr.group, playerRows);

              const details = `
                <tr class="group-details" data-group="${esc(gr.group)}" style="${open ? "" : "display:none"}">
                  <td colspan="5" style="padding:0">
                    <div style="padding:10px 10px 12px 10px; border-top:1px solid rgba(255,255,255,.06)">
                      <div style="display:flex; justify-content:space-between; align-items:flex-end; gap:10px; margin-bottom:8px">
                        <div style="font-weight:900; color:${groupColor(gr.group)}">${esc(gr.group)} – Mitglieder</div>
                        <div style="font-size:12px; color:var(--muted)">Sortiert nach km</div>
                      </div>

                      <table style="width:100%; border-collapse:collapse; background:rgba(0,0,0,.06); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-top:0">
                        <thead>
                          <tr>
                            <th>#</th>
                            <th>Spieler</th>
                            <th class="km">km</th>
                          </tr>
                        </thead>
                        <tbody>
                          ${members.map((m, idx) => `
                            <tr style="border-top:1px solid rgba(255,255,255,.06)">
                              <td>${idx+1}</td>
                              <td style="font-weight:800">${esc(m.name)}${idx===0 ? `<span style="margin-left:8px">👑</span>` : ""}</td>
                              <td class="km">${Number(m.km).toFixed(2)}</td>
                            </tr>
                          `).join("")}
                        </tbody>
                      </table>
                    </div>
                  </td>
                </tr>
              `;

              return `
                <tr class="group-row rowclick" data-group="${esc(gr.group)}">
                  <td class="caret" style="color:${groupColor(gr.group)}">${open ? "▾" : "▸"}</td>
                  <td>${trend(gr.rank_delta)}</td>
                  <td>${gr.current_rank}</td>
                  <td><b style="color:${groupColor(gr.group)}">${esc(gr.group)}</b></td>
                  <td class="km">${Number(gr.km).toFixed(2)}</td>
                </tr>
                ${details}
              `;
            }).join("")}
          </tbody>
        </table>
      `;

      wireAdmin();
    }

    // ====== VIEW SWITCH ======
    function setView(which){
      const pv = $("playersView");
      const gv = $("groupsView");
      const tp = $("tabPlayers");
      const tg = $("tabGroups");

      if (which === "groups"){
        pv.style.display = "none";
        gv.style.display = "block";
        tp.classList.remove("active");
        tg.classList.add("active");
      } else {
        gv.style.display = "none";
        pv.style.display = "block";
        tg.classList.remove("active");
        tp.classList.add("active");
      }
    }

    $("tabPlayers").addEventListener("click", () => setView("players"));
    $("tabGroups").addEventListener("click", () => setView("groups"));

    // Accordions
    document.addEventListener("click", (e) => {
      const pr = e.target.closest && e.target.closest("tr.player-row");
      if (pr){
        const name = pr.getAttribute("data-player");
        expandedPlayer = (expandedPlayer === name) ? null : name;
        render();
        return;
      }
      const gr = e.target.closest && e.target.closest("tr.group-row");
      if (gr){
        const name = gr.getAttribute("data-group");
        expandedGroup = (expandedGroup === name) ? null : name;
        render();
      }
    });

    // ====== INIT ======
    async function init(){
      const res = await fetch("data.json", { cache: "no-store" });
      if (!res.ok) throw new Error("data.json nicht gefunden (Status " + res.status + ")");
      DATA = await res.json();
      if (!DATA.groups || !DATA.players) throw new Error("data.json fehlt groups/players");
      render();
    }

    document.addEventListener("DOMContentLoaded", () => {
      init().catch(err => {
        console.error(err);
        $("playersView").innerHTML =
          `<div class="hint">Fehler: ${esc(err.message)}<br>Prüfe, ob <code>data.json</code> im Repo-Root liegt und gültiges JSON ist.</div>`;
      });
    });
  </script>
</body>
</html>
