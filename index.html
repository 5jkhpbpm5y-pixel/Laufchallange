<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Laufchallenge</title>
  <style>
    :root{
      --bg:#0b0f14;
      --card:#121925;
      --card2:#0f1520;
      --border:#233044;
      --text:#e8eef7;
      --muted:#9aa7b6;
      --accent:#22c55e;
      --bad:#ff6b6b;
    }

    *{
      box-sizing:border-box;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
    }

    body{
      margin:0;
      background:
        radial-gradient(1200px 600px at 20% 0%, #142033 0%, var(--bg) 55%),
        var(--bg);
      color:var(--text);
      padding:18px;
    }

    .wrap{
      max-width:980px;
      margin:0 auto;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .top{
      display:flex;
      gap:12px;
      align-items:flex-end;
      justify-content:space-between;
      flex-wrap:wrap;
    }

    h1{
      margin:0;
      font-size:22px;
      letter-spacing:.2px;
    }

    .sub{
      color:var(--muted);
      font-size:12px;
      margin-top:6px;
    }

    .card{
      background:
        linear-gradient(180deg, rgba(255,255,255,.03), transparent),
        var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:14px;
    }

    .side{
      background:
        linear-gradient(180deg, rgba(255,255,255,.02), transparent),
        var(--card2);
    }

    .tabs{
      display:inline-flex;
      border:1px solid var(--border);
      border-radius:999px;
      overflow:hidden;
      background:rgba(255,255,255,.02);
    }

    .tab{
      padding:9px 12px;
      font-size:13px;
      border:0;
      color:var(--text);
      background:transparent;
      cursor:pointer;
    }

    .tab.active{
      background:rgba(34,197,94,.15);
      color:#dff7e8;
    }

    .metaRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
      margin-top:8px;
    }

    .pill{
      border:1px solid var(--border);
      background:rgba(255,255,255,.02);
      padding:5px 10px;
      border-radius:999px;
      font-size:12px;
      color:var(--muted);
    }

    .pill b{
      color:var(--text);
    }

    .grid2{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
    }

    @media (min-width:860px){
      .grid2{
        grid-template-columns:1.3fr .7fr;
      }
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:10px;
      background:rgba(0,0,0,.06);
      border:1px solid var(--border);
      border-radius:14px;
      overflow:hidden;
    }

    th,td{
      padding:10px;
      border-bottom:1px solid rgba(255,255,255,.06);
      text-align:left;
    }

    th{
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:var(--muted);
      background:rgba(255,255,255,.02);
    }

    tr:last-child td{
      border-bottom:0;
    }

    .km{
      font-variant-numeric:tabular-nums;
    }

    .trend{
      font-variant-numeric:tabular-nums;
      white-space:nowrap;
    }

    .up{ color:var(--accent); }
    .down{ color:var(--bad); }
    .same{ color:var(--muted); }

    .name{
      display:flex;
      gap:8px;
      align-items:center;
    }

    .tag{
      font-size:11px;
      color:var(--muted);
      border:1px solid rgba(255,255,255,.08);
      padding:2px 8px;
      border-radius:999px;
      background:rgba(255,255,255,.02);
      display:inline-block;
    }

    .hint{
      color:var(--muted);
      font-size:12px;
      line-height:1.4;
      margin-top:10px;
    }

    .list{
      display:flex;
      flex-direction:column;
      gap:6px;
      margin-top:8px;
    }

    .li{
      display:flex;
      justify-content:space-between;
      gap:10px;
    }

    .li > div{
      width:100%;
      padding:8px 10px;
      border:1px solid rgba(255,255,255,.06);
      border-radius:12px;
      background:rgba(255,255,255,.02);
    }

    .li small{
      color:var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>⚽ Laufchallenge</h1>
        <div class="sub">Einzelrangliste & Gruppenübersicht · sortiert nach km · ▲/▼ seit letztem Stand</div>
      </div>

      <div class="tabs" role="tablist">
        <button class="tab active" id="tabPlayers" onclick="setView('players')">Einzel</button>
        <button class="tab" id="tabGroups" onclick="setView('groups')">Gruppen</button>
      </div>
    </div>

    <div class="grid2">
      <div class="card" id="mainCard">
        <div class="metaRow">
          <div class="pill">Stand: <b id="stamp">—</b></div>
          <div class="pill">Hinweis: Trends = Vergleich zum letzten Stand</div>
        </div>

        <div id="playersView"></div>
        <div id="groupsView" style="display:none"></div>
      </div>

      <div class="card side">
        <div style="font-weight:700">Gruppen</div>
        <div class="hint">Übersicht. Ranglisten sind links in den Tabs.</div>
        <div class="list" id="groupList"></div>
        <div class="hint" style="margin-top:12px">Admin: km im Code ändern → Seite neu laden.</div>
      </div>
    </div>
  </div>

  <script>
    /** =========================
     *  ADMIN-DATEN (nur hier pflegen)
     *  ========================= */

    // Stand-Anzeige
    const STAND_TEXT = "06.01.2026";

    // Gruppen + Spieler
    const GROUPS = [
      { id:"lg", name:"Leader Gruppe", members:["Alexander Auhagen","Thomas Kümmerle","Fabian Füßl"] },

      { id:"g1", name:"Gruppe 1", members:["Valentin Ertl","Martin Winklmaier","Lucas Gschmeidler","Vinzenz Ertl"] },
      { id:"g2", name:"Gruppe 2", members:["Nac","Alois Breu","Luis Müller","Lukas Zieglmaier"] },
      { id:"g3", name:"Gruppe 3", members:["Alexandru Kohonicz","Lukas Königer","Philipp Gschaider","Philipp Köhl"] },
      { id:"g4", name:"Gruppe 4", members:["Paul Lohse","Johannes Eller","Maximilian Knopp","Thomas Boukal"] },
      { id:"g5", name:"Gruppe 5", members:["Bernhard Galster","Luca Rott","Paul Dirschl","Sebastian Seidl"] },
      { id:"g6", name:"Gruppe 6", members:["David Neumann","Leon Kümmerle","Berkay Köroglu","Sebastian Haag"] },
      { id:"g7", name:"Gruppe 7", members:["Kevin Treis","Edi Gashi","Elias Angulanza","Tim Seibold"] },
    ];

    // Gruppenfarben
    const GROUP_COLORS = {
      "Leader Gruppe": "#dc2626", // rot
      "Gruppe 1": "#16a34a",      // grün
      "Gruppe 2": "#92400e",      // braun
      "Gruppe 3": "#facc15",      // gelb
      "Gruppe 4": "#f97316",      // orange
      "Gruppe 5": "#ec4899",      // pink
      "Gruppe 6": "#06b6d4",      // cyan
      "Gruppe 7": "#2563eb",      // blau
    };

    // KM je Spieler (hier eintragen). previousRank optional für ▲/▼.
    const PLAYER_KM = [
      // Leader Gruppe
      { name:"Alexander Auhagen", km:0, previousRank:null },
      { name:"Thomas Kümmerle", km:0, previousRank:null },
      { name:"Fabian Füßl", km:0, previousRank:null },

      // Gruppe 1
      { name:"Valentin Ertl", km:0, previousRank:null },
      { name:"Martin Winklmaier", km:0, previousRank:null },
      { name:"Lucas Gschmeidler", km:0, previousRank:null },
      { name:"Vinzenz Ertl", km:0, previousRank:null },

      // Gruppe 2
      { name:"Nac", km:0, previousRank:null },
      { name:"Alois Breu", km:0, previousRank:null },
      { name:"Luis Müller", km:0, previousRank:null },
      { name:"Lukas Zieglmaier", km:0, previousRank:null },

      // Gruppe 3
      { name:"Alexandru Kohonicz", km:0, previousRank:null },
      { name:"Lukas Königer", km:0, previousRank:null },
      { name:"Philipp Gschaider", km:0, previousRank:null },
      { name:"Philipp Köhl", km:0, previousRank:null },

      // Gruppe 4
      { name:"Paul Lohse", km:0, previousRank:null },
      { name:"Johannes Eller", km:0, previousRank:null },
      { name:"Maximilian Knopp", km:0, previousRank:null },
      { name:"Thomas Boukal", km:0, previousRank:null },

      // Gruppe 5
      { name:"Bernhard Galster", km:0, previousRank:null },
      { name:"Luca Rott", km:0, previousRank:null },
      { name:"Paul Dirschl", km:0, previousRank:null },
      { name:"Sebastian Seidl", km:0, previousRank:null },

      // Gruppe 6
      { name:"David Neumann", km:0, previousRank:null },
      { name:"Leon Kümmerle", km:0, previousRank:null },
      { name:"Berkay Köroglu", km:0, previousRank:null },
      { name:"Sebastian Haag", km:0, previousRank:null },

      // Gruppe 7
      { name:"Kevin Treis", km:0, previousRank:null },
      { name:"Edi Gashi", km:0, previousRank:null },
      { name:"Elias Angulanza", km:0, previousRank:null },
      { name:"Tim Seibold", km:0, previousRank:null },
    ];

    // Gruppen-spezifischer previousRank (optional für ▲/▼)
    const GROUP_PREV = {
      // "Gruppe 1": 2,
      // "Leader Gruppe": 1,
    };

    /** =========================
     *  LOGIK
     *  ========================= */

    document.getElementById("stamp").textContent = STAND_TEXT;

    // Name -> Gruppe
    const nameToGroup = new Map();
    for (const g of GROUPS) for (const m of g.members) nameToGroup.set(m, g.name);

    function groupColor(name){
      return GROUP_COLORS[name] || "#94a3b8";
    }

    function trend(delta){
      if (delta > 0) return `<span class="trend up">▲ ${delta}</span>`;
      if (delta < 0) return `<span class="trend down">▼ ${Math.abs(delta)}</span>`;
      return `<span class="trend same">—</span>`;
    }

    function denseRank(sorted, keyFn){
      let rank = 0;
      let last = null;
      return sorted.map((x) => {
        const v = keyFn(x);
        if (last === null || v !== last) rank++;
        last = v;
        return { ...x, current_rank: rank };
      });
    }

    function esc(s){
      return String(s).replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[m]));
    }

    // Accordion: immer nur 1 Gruppe offen
    let expandedGroup = null; // string | null

    function groupMembersSorted(groupName, playerRows){
      const members = (GROUPS.find(g => g.name === groupName)?.members) || [];
      const kmByName = new Map(playerRows.map(p => [p.name, Number(p.km || 0)]));

      return members
        .map(name => ({ name, km: kmByName.get(name) ?? 0 }))
        .sort((a,b) => (b.km - a.km) || a.name.localeCompare(b.name));
    }

    function buildPlayerRows(){
      const rows = PLAYER_KM
        .map(p => ({
          ...p,
          group: nameToGroup.get(p.name) || "—"
        }))
        .sort((a,b) => (b.km - a.km) || a.name.localeCompare(b.name));

      const ranked = denseRank(rows, r => r.km);

      return ranked.map(r => {
        const prev = (r.previousRank == null) ? r.current_rank : r.previousRank;
        const delta = prev - r.current_rank;
        return { ...r, previous_rank: prev, rank_delta: delta };
      });
    }

    function buildGroupRows(playerRows){
      const totals = new Map();
      for (const g of GROUPS) totals.set(g.name, 0);

      for (const p of playerRows){
        if (totals.has(p.group)) totals.set(p.group, totals.get(p.group) + Number(p.km || 0));
      }

      const rows = Array.from(totals.entries())
        .map(([group, km]) => ({ group, km: Number(km.toFixed(2)) }))
        .sort((a,b) => (b.km - a.km) || a.group.localeCompare(b.group));

      const ranked = denseRank(rows, r => r.km);

      return ranked.map(r => {
        const prev = (GROUP_PREV[r.group] == null) ? r.current_rank : GROUP_PREV[r.group];
        const delta = prev - r.current_rank;
        return { ...r, previous_rank: prev, rank_delta: delta };
      });
    }

    function render(){
      // Sidebar: Gruppenliste (mit Mitgliedern)
      const gl = document.getElementById("groupList");
      gl.innerHTML = GROUPS.map(g => `
        <div class="li">
          <div>
            <b style="color:${groupColor(g.name)}">${esc(g.name)}</b><br>
            <small>${g.members.map(esc).join(", ")}</small>
          </div>
        </div>
      `).join("");

      const playerRows = buildPlayerRows();
      const groupRows = buildGroupRows(playerRows);

      // Einzel
      document.getElementById("playersView").innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Trend</th>
              <th>Rang</th>
              <th>Spieler</th>
              <th>Gruppe</th>
              <th class="km">km</th>
            </tr>
          </thead>
          <tbody>
            ${playerRows.map(r => `
              <tr>
                <td>${trend(r.rank_delta)}</td>
                <td>${r.current_rank}</td>
                <td><span class="name"><b>${esc(r.name)}</b></span></td>
                <td>
                  <span class="tag" style="border-color:${groupColor(r.group)}; color:${groupColor(r.group)}">
                    ${esc(r.group)}
                  </span>
                </td>
                <td class="km">${Number(r.km).toFixed(2)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;

      // Gruppen (Accordion + 👑 für #1)
      document.getElementById("groupsView").innerHTML = `
        <table>
          <thead>
            <tr>
              <th></th>
              <th>Trend</th>
              <th>Rang</th>
              <th>Gruppe</th>
              <th class="km">km</th>
            </tr>
          </thead>
          <tbody>
            ${groupRows.map(gr => {
              const isOpen = expandedGroup === gr.group;
              const members = groupMembersSorted(gr.group, playerRows);

              const detailsRow = `
                <tr class="group-details" data-group="${esc(gr.group)}" style="${isOpen ? "" : "display:none"}">
                  <td colspan="5" style="padding:0">
                    <div style="padding:10px 10px 12px 10px; border-top:1px solid rgba(255,255,255,.06)">
                      <div style="display:flex; justify-content:space-between; align-items:flex-end; gap:10px; margin-bottom:8px">
                        <div style="font-weight:700; color:${groupColor(gr.group)}">${esc(gr.group)} – Mitglieder</div>
                        <div style="font-size:12px; color:var(--muted)">Sortiert nach km</div>
                      </div>

                      <table style="width:100%; border-collapse:collapse; background:rgba(0,0,0,.06); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-top:0">
                        <thead>
                          <tr>
                            <th style="padding:8px 10px">#</th>
                            <th style="padding:8px 10px">Spieler</th>
                            <th style="padding:8px 10px" class="km">km</th>
                          </tr>
                        </thead>
                        <tbody>
                          ${members.map((m, idx) => {
                            const crown = idx === 0 ? `<span title="Platz 1" style="margin-left:8px">👑</span>` : "";
                            return `
                              <tr style="border-top:1px solid rgba(255,255,255,.06)">
                                <td style="padding:8px 10px">${idx + 1}</td>
                                <td style="padding:8px 10px; font-weight:700">${esc(m.name)}${crown}</td>
                                <td style="padding:8px 10px" class="km">${Number(m.km).toFixed(2)}</td>
                              </tr>
                            `;
                          }).join("")}
                        </tbody>
                      </table>
                    </div>
                  </td>
                </tr>
              `;

              return `
                <tr class="group-row" data-group="${esc(gr.group)}" style="cursor:pointer">
                  <td style="width:26px; color:${groupColor(gr.group)}; font-weight:900">
                    ${isOpen ? "▾" : "▸"}
                  </td>
                  <td>${trend(gr.rank_delta)}</td>
                  <td>${gr.current_rank}</td>
                  <td><b style="color:${groupColor(gr.group)}">${esc(gr.group)}</b></td>
                  <td class="km">${Number(gr.km).toFixed(2)}</td>
                </tr>
                ${detailsRow}
              `;
            }).join("")}
          </tbody>
        </table>
      `;
    }

    // Tabs umschalten
    window.setView = function(which){
      const pv = document.getElementById("playersView");
      const gv = document.getElementById("groupsView");
      const tp = document.getElementById("tabPlayers");
      const tg = document.getElementById("tabGroups");

      if (which === "groups"){
        pv.style.display = "none";
        gv.style.display = "block";
        tp.classList.remove("active");
        tg.classList.add("active");
      } else {
        gv.style.display = "none";
        pv.style.display = "block";
        tg.classList.remove("active");
        tp.classList.add("active");
      }
    };

    // Klick: Accordion (immer nur 1 offen)
    document.addEventListener("click", (e) => {
      const tr = e.target.closest?.("tr.group-row");
      if (!tr) return;

      const group = tr.getAttribute("data-group");
      if (!group) return;

      expandedGroup = (expandedGroup === group) ? null : group;
      render();
    });

    render();
  </script>
</body>
</html>
